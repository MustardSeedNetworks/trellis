# =============================================================================
# goreleaser config for Trellis
# =============================================================================
# Canonical packaging config. .github/workflows/release.yml drives this on
# tag push (or workflow_dispatch dry-run).
#
# Shape mirrors seed/stem/niac's .goreleaser.yml so all four projects share
# the same release tooling, trimmed to what Trellis actually has today:
#
# Covers natively:
#   - Multi-arch builds (linux/windows amd64+arm64; darwin arm64 only)
#   - Archives (.tar.gz, .zip)
#   - ldflags injection (Version, Commit, BuildTime, UIBuildHash) into
#     internal/version — the canonical contract shared with seed/stem/niac
#   - cosign keyless signing of every artifact
#   - syft SBOM per archive
#   - SHA-256 checksums
#   - .deb/.rpm packages via nfpm — the binary, the licence and a systemd
#     *user* unit that ships disabled. Per ADR-0007 there is no system
#     service, no service user, no /etc config and no port: trellisd serves
#     one operator on loopback and keeps surveys in their own XDG data
#     directory. That is why this block looks nothing like seed/stem/niac's.
#     SBOMs cover the packages as well as the archives.
#
# Deliberately NOT covered (unlike stem/seed/niac):
#   - Native C dataplane — Trellis has no C dataplane.
#   - The signed macOS .app — deploy/macos/build-app.sh builds and signs it.
#     Only a signed, entitled bundle can read Wi-Fi network names; the archive
#     below ships the bare daemon.
#
# Handled outside goreleaser:
#   - UI frontend build — runs in the build-ui job inside release.yml;
#     Vite writes directly to internal/api/ui/ which Go embeds. The
#     `before:` hook below just verifies the dist landed.
# =============================================================================

version: 2

project_name: trellis

before:
  hooks:
    - go mod download
    - bash -c 'test -f internal/api/ui/index.html || (echo "internal/api/ui/index.html missing — UI build step failed or artifact missing"; exit 1)'

builds:
  - id: trellis-linux-amd64
    main: ./cmd/trellisd
    mod_timestamp: "{{ .CommitTimestamp }}"
    binary: trellisd
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64]
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags: &ldflags
      - -s -w
      - -X github.com/MustardSeedNetworks/trellis/internal/version.Version={{.Version}}
      - -X github.com/MustardSeedNetworks/trellis/internal/version.Commit={{.Commit}}
      - -X github.com/MustardSeedNetworks/trellis/internal/version.BuildTime={{.CommitDate}}
      - -X github.com/MustardSeedNetworks/trellis/internal/version.UIBuildHash={{.Env.UI_BUILD_HASH}}

  - id: trellis-linux-arm64
    main: ./cmd/trellisd
    mod_timestamp: "{{ .CommitTimestamp }}"
    binary: trellisd
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [arm64]
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags: *ldflags

  # darwin is the one target built with cgo: trellisd links its Wi-Fi capture
  # backend directly (ADR-0006) and that backend binds CoreWLAN. Built with
  # CGO_ENABLED=0 the tree still compiles, but capture.New() reports
  # ErrUnsupported and the binary can never scan — so this must stay 1.
  - id: trellis-darwin
    main: ./cmd/trellisd
    mod_timestamp: "{{ .CommitTimestamp }}"
    binary: trellisd
    # Set only by `make packages` on a Linux host, which has no macOS toolchain
    # and wants the deb/rpm. The release pipeline never sets it.
    skip: '{{ envOrDefault "TRELLIS_SKIP_DARWIN" "false" }}'
    env:
      - CGO_ENABLED=1
    goos: [darwin]
    # Intel macOS (amd64) support dropped fleet-wide 2026-06-08 — Apple Silicon only.
    goarch: [arm64]
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags: *ldflags
    # macOS cross-compile via osxcross (bundled in goreleaser-cross). The SDK
    # carries CoreWLAN and CoreLocation; the CC paths are stable in the image.
    # On a Mac there is no osxcross and no need for one — the Makefile's
    # `packages` target points these at the native clang so a developer can
    # build the same artifacts release.yml will.
    overrides:
      - goos: darwin
        goarch: arm64
        env:
          - 'CC={{ envOrDefault "TRELLIS_DARWIN_CC" "oa64-clang" }}'
          - 'CXX={{ envOrDefault "TRELLIS_DARWIN_CXX" "oa64-clang++" }}'

  - id: trellis-windows
    main: ./cmd/trellisd
    mod_timestamp: "{{ .CommitTimestamp }}"
    binary: trellisd
    env:
      - CGO_ENABLED=0
    goos: [windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags: *ldflags

archives:
  - id: linux-archive
    ids: [trellis-linux-amd64, trellis-linux-arm64]
    name_template: "trellis-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    formats: [tar.gz]

  - id: darwin-archive
    # A bare trellisd, not the signed Trellis.app. It serves imported surveys
    # and will scan, but macOS gives Wi-Fi network names only to a signed,
    # entitled, LaunchServices-launched bundle — built by
    # deploy/macos/build-app.sh, not by goreleaser, because it needs signing
    # identities this pipeline does not carry.
    ids: [trellis-darwin]
    name_template: "trellis-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    formats: [tar.gz]

  - id: windows-archive
    ids: [trellis-windows]
    name_template: "trellis-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    formats: [zip]

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

nfpms:
  - id: linux-packages
    ids: [trellis-linux-amd64, trellis-linux-arm64]
    package_name: trellis
    vendor: Mustard Seed Networks
    homepage: https://github.com/MustardSeedNetworks/trellis
    maintainer: Kris Armstrong <kris.armstrong@icloud.com>
    description: |
      Trellis - Wi-Fi survey and planning by Mustard Seed Networks
      .
      trellisd walks a floor with a supported adapter, imports surveys captured
      by other tools, and renders coverage heatmaps and PDF reports. It serves
      its UI on loopback for the operator who launched it.
    license: BUSL-1.1
    section: net
    priority: optional
    formats:
      - deb
      - rpm
    file_name_template: >-
      {{- if eq .ConventionalExtension ".deb" -}}
        trellis_{{ .Version }}_{{ .Arch }}
      {{- else if eq .ConventionalExtension ".rpm" -}}
        {{- $rpmarch := .Arch -}}
        {{- if eq .Arch "amd64" }}{{ $rpmarch = "x86_64" }}{{ end -}}
        {{- if eq .Arch "arm64" }}{{ $rpmarch = "aarch64" }}{{ end -}}
        trellis-{{ .Version }}-1.{{ $rpmarch }}
      {{- end -}}
    # No dependency on systemd: the unit below is a user unit that ships
    # disabled, so a machine without systemd installs the binary and loses
    # nothing it would otherwise have had.
    contents:
      - src: ./deploy/systemd/trellisd.user.service
        dst: /usr/lib/systemd/user/trellisd.service
        file_info:
          mode: 0o644
      - src: ./LICENSE
        dst: /usr/share/doc/trellis/LICENSE
        file_info:
          mode: 0o644
      - src: ./docs/10-WIFI-CAPTURE.md
        dst: /usr/share/doc/trellis/WIFI-CAPTURE.md
        file_info:
          mode: 0o644
    # No scripts. Nothing is enabled, started, chowned or created at install
    # time (ADR-0007): the package owns nothing outside /usr, which is also
    # why remove and purge are the same operation and no survey is ever
    # deleted by one.
    bindir: /usr/bin

sboms:
  - id: archives-sbom
    artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.json"
  # .deb/.rpm are `package` artifacts, not `archive` — without this block the
  # native packages, the ones people actually install, would ship with no bill
  # of materials.
  - id: packages-sbom
    artifacts: package
    documents:
      - "{{ .ArtifactName }}.sbom.json"

signs:
  # Sign all release artifacts via cosign keyless OIDC. Mirrors seed/stem/niac's
  # signing block.
  - cmd: cosign
    signature: "${artifact}.cosign.bundle"
    args:
      - sign-blob
      - "--yes"
      - "--bundle"
      - "${artifact}.cosign.bundle"
      - "${artifact}"
    artifacts: all
    output: true

release:
  github:
    owner: MustardSeedNetworks
    name: trellis
  # Published artifacts are immutable. `replace_existing_artifacts` +
  # `mode: replace` let a re-run of the same tag overwrite assets that people
  # may already have downloaded, verified against a checksum, or pinned — which
  # defeats the signatures and provenance produced two steps later. A corrected
  # release gets a new patch tag instead.
  replace_existing_artifacts: false
  draft: false
  prerelease: auto
  mode: keep-existing
  header: |
    Trellis {{ .Tag }} — Wi-Fi Survey & Planning by Mustard Seed Networks.

snapshot:
  version_template: "0.0.0-dryrun-{{ .ShortCommit }}"
