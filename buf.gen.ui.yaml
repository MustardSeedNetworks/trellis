# Local plugin, pinned as a devDependency in ui/package.json — see buf.gen.yaml
# for why nothing here is a BSR `remote:` plugin. The version must equal the
# @bufbuild/protobuf runtime it generates against, and being an npm dependency
# is what puts it under .npmrc's min-release-age embargo and Renovate's npm
# manager. `npm ci` in ui/ is a prerequisite of `make generate-ts`.
version: v2
inputs:
  - directory: proto
plugins:
  # protoc-gen-es v2 (Connect-ES v2 line) emits both message types and the
  # GenService descriptor from a single plugin — no separate connect-es
  # plugin is needed; @connectrpc/connect's createClient() consumes the
  # GenService directly.
  - local: ui/node_modules/.bin/protoc-gen-es
    out: ui/src/gen
    opt:
      - target=ts
