# Local plugin, version-pinned in the command rather than as a BSR `remote:`
# plugin — see buf.gen.yaml. The version must equal the @bufbuild/protobuf
# runtime it generates against. protoc-gen-es writes that version into every
# generated file (`@generated by protoc-gen-es vX.Y.Z`), so an unpinned binary
# — whatever ui/node_modules happened to contain — makes `make check-generated`
# fail as soon as the dependency moves ahead of the committed tree. That is
# the 2026-10-15 merge-queue failure: survey_pb.ts flipped from
# `protoc-gen-es v2.15.0` to `v2.16.0` and nothing else.
#
# `npx --package=@bufbuild/protoc-gen-es@<version>` runs that exact build.
# renovate.json tracks the pin and regenerates ui/src/gen on the bump.
version: v2
inputs:
  - directory: proto
plugins:
  # protoc-gen-es v2 (Connect-ES v2 line) emits both message types and the
  # GenService descriptor from a single plugin — no separate connect-es
  # plugin is needed; @connectrpc/connect's createClient() consumes the
  # GenService directly.
  - local:
      - npx
      - --yes
      - "--package=@bufbuild/protoc-gen-es@2.16.0"
      - protoc-gen-es
    out: ui/src/gen
    opt:
      - target=ts
