# =============================================================================
# Auto-Labeler - Trellis
# =============================================================================
# Automatically labels PRs based on file paths and issues based on form inputs.
# =============================================================================

name: Auto-Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issues:
    types: [opened, edited]

permissions: {}

jobs:
  # ===========================================================================
  # Label PRs based on file paths
  # ===========================================================================
  label-pr:
    name: Label PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: ".github/labeler.yml"

  # ===========================================================================
  # Label issues based on form inputs
  # ===========================================================================
  # Trellis has no issue form templates yet, so this has no component/priority
  # map to match against (unlike seed/stem/niac). Kept as a no-op scaffold —
  # matches nothing today, ready to wire up once issue forms exist.
  label-issue:
    name: Label Issue
    runs-on: ubuntu-latest
    if: github.event_name == 'issues'
    permissions:
      issues: write

    steps:
      - name: Parse issue and apply labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const labelsToAdd = [];

            // Priority mapping (shared vocabulary across the fleet's issue forms).
            const priorityMap = {
              'Critical': 'priority: critical',
              'High': 'priority: high',
              'Medium': 'priority: medium',
              'Low': 'priority: low',
              'Nice to have': 'priority: low',
              'Would improve my workflow': 'priority: medium',
              'Important for my use case': 'priority: high',
              'Critical - blocking my use': 'priority: critical',
            };

            // Severity mapping (for bugs)
            const severityMap = {
              'Critical - App crashes or data loss': 'priority: critical',
              'High - Major feature broken': 'priority: high',
              'Medium - Feature partially broken': 'priority: medium',
              'Low - Minor issue or cosmetic': 'priority: low',
            };

            for (const [key, label] of Object.entries({...priorityMap, ...severityMap})) {
              if (body.includes(key)) {
                labelsToAdd.push(label);
                break;
              }
            }

            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: labelsToAdd
              });
              console.log(`Added labels: ${labelsToAdd.join(', ')}`);
            }
