# =============================================================================
# Release (goreleaser)
# =============================================================================
# Canonical release pipeline. Drives .goreleaser.yml inside the
# goreleaser-cross container.
#
# Triggers:
#   - push to a v* tag: real release - builds, signs, publishes
#   - workflow_dispatch with dry_run=true: snapshot only - no publish, no
#     signing; artifacts uploaded for inspection
#   - workflow_dispatch with provenance_only=true (ref=<existing tag>):
#     skips goreleaser entirely, recomputes artifact subjects from the
#     already-published checksums.txt on that tag's GitHub release, then
#     runs attest-build-provenance + uploads the .intoto.jsonl. Used to
#     retroactively attest tags that shipped before the provenance job
#     existed. provenance_only takes precedence over dry_run.
#
# Mirrors seed/stem/niac's release.yml shape so all four projects converge
# on the same release tooling. Unlike stem, there is no native C dataplane
# to build. The .deb/.rpm carry a systemd user unit and no system service
# (ADR-0007, see .goreleaser.yml).
#
# macOS .pkg:
#   pkgbuild and codesign exist only on macOS, so macos-pkg builds the
#   installer on a macOS runner from the darwin archive goreleaser produced,
#   wraps trellisd in the entitled Trellis.app, signs and notarizes it,
#   finishes the checksum manifest, and feeds the provenance job. Only a
#   Developer ID signed, entitled bundle can read Wi-Fi network names, so a
#   real release without the signing secrets fails here rather than ship a
#   package that cannot scan. Secrets: MACOS_SIGNING_P12_BASE64,
#   MACOS_SIGNING_P12_PASSWORD (one .p12 holding the Developer ID Application
#   and Developer ID Installer identities), APPLE_NOTARY_KEY_P8_BASE64,
#   APPLE_NOTARY_KEY_ID, APPLE_NOTARY_ISSUER_ID.
#
# Inputs: only the typed `dry_run` boolean - no untrusted event fields
# are interpolated into shell commands.
# =============================================================================

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Snapshot build only - do not publish or sign"
        type: boolean
        default: true
      provenance_only:
        description: "Backfill: skip build, recompute subjects from the existing release's checksums.txt, attest + upload bundle"
        type: boolean
        default: false
      sign_macos:
        description: "With dry_run: sign and notarize the macOS .pkg for real (needs the signing secrets) instead of ad hoc. Still publishes nothing."
        type: boolean
        default: false
      target_tag:
        description: "Backfill target tag (e.g. v0.1.0). Required when provenance_only=true — workflow_dispatch must be issued against main since older tags don't have these inputs."
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A v* tag is enough to start a release: no ruleset restricts tag creation in
  # any fleet repo (verified 2026-08-27 — the only ruleset present is
  # merge-queue, and it targets branches). Until tag protection lands, this is
  # the gate. It refuses to build a tag whose commit never passed CI, so an
  # accidental or unauthorised tag fails here instead of producing signed,
  # published artifacts.
  #
  # The assertion is skipped for workflow_dispatch, which is the deliberate
  # dry-run path and carries no tag — but the job itself still runs and
  # succeeds, so nothing downstream is skipped.
  verify-tag:
    name: Verify tagged commit passed CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
    steps:
      # The condition is on the step, not the job. A job-level `if:` that
      # evaluated false would leave this SKIPPED, and a skipped `needs:` entry
      # skips everything downstream through the implicit success() — the whole
      # dry-run path would silently do nothing. As a step, the job still
      # reports success and dependents run normally.
      - name: Assert CI Complete succeeded for this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # index() returns 0 for a first-element match, and jq's // only fires
          # on null/false — so a match at position 0 still prints 0 and passes.
          found=$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "CI Complete") | .conclusion] | index("success") // empty')
          if [ -z "$found" ]; then
            echo "::error::No successful 'CI Complete' check run for ${GITHUB_SHA}. Refusing to release an unvalidated commit."
            exit 1
          fi
          echo "CI Complete succeeded for ${GITHUB_SHA}"

  # =========================================================================
  # UI build - done outside the goreleaser-cross container because that
  # image is Go-focused and doesn't ship Node. Vite writes directly to
  # internal/api/ui/; the next job inherits the workspace.
  # =========================================================================
  build-ui:
    name: Build UI
    if: ${{ !inputs.provenance_only }}
    needs: [verify-tag]
    runs-on: ubuntu-latest
    outputs:
      ui_hash: ${{ steps.ui-hash.outputs.hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        # The Node/npm pin lives in the composite action, same as ci.yml, so
        # the release path cannot drift from what CI tested against.
        uses: ./.github/actions/setup-node
        with:
          # No npm cache on the release path. This job's output is published
          # and attested, so a poisoned cache entry restored from a branch
          # would land in a signed artifact. CI keeps its cache; releases
          # always resolve from the registry.
          cache: ""

      - name: Build UI
        run: |
          cd ui
          npm ci
          npm run build

      - name: Compute UI build hash
        id: ui-hash
        run: |
          # The same script the Makefile, the macOS bundle and the E2E daemon
          # use, so a released binary and a `make build` agree on the hash.
          UI_BUILD_HASH=$(./scripts/ui-build-hash.sh)
          echo "hash=$UI_BUILD_HASH" >> "$GITHUB_OUTPUT"

      - name: Upload UI dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-dist
          path: internal/api/ui/
          retention-days: 1
          include-hidden-files: true

  # =========================================================================
  # goreleaser build + (when not dry-run) publish.
  # =========================================================================
  goreleaser:
    name: goreleaser
    if: ${{ !inputs.provenance_only }}
    runs-on: ubuntu-latest
    needs: [build-ui]
    permissions:
      contents: write
      id-token: write # cosign keyless OIDC
    container:
      # Docker Hub tag scheme: <go-version>-<image-rev>-<goreleaser-version>.
      # v1.27.1-2-v2.18.2 tracks Go 1.27.1 (image rev 2) + goreleaser v2.18.2.
      # Pinned for reproducibility; bump when newer revs land. Keep fresh so
      # the image's baked libs don't drift from upstream (seed#1577).
      image: goreleaser/goreleaser-cross:v1.27.1-2-v2.18.2@sha256:8def7638d4f31ce8b22034694875c41c0cccb8392c9d06258c7dca9383bf1948
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Mark workspace as safe (container runs as root)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download UI dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: internal/api/ui/

      - name: Install Syft (SBOM) inside container
        env:
          # Pinned version + checksum (from syft's published checksums.txt),
          # matching seed/stem's pattern — `curl ... install.sh | sh` from
          # the mutable `main` branch is a supply-chain risk (a compromised
          # main would run arbitrary code in the release container). Rotate
          # together on upgrade.
          SYFT_VERSION: "1.46.0"
          SYFT_SHA256: "d654f678b709eb53c393d38519d5ed7d2e57205529404018614cfefa0fb2b5ca"
        # Container run steps default to `sh` (dash), which rejects
        # `set -o pipefail`; force bash (present in goreleaser-cross).
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL -o syft.tar.gz \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  syft.tar.gz" | sha256sum -c -
          tar -xzf syft.tar.gz -C /usr/local/bin syft
          chmod +x /usr/local/bin/syft

      # Downloaded and executed in a job holding contents: write and
      # id-token: write, so an unverified binary here signs the release. Syft
      # two steps above was already checksummed; cosign was the outlier.
      # Checksum from the upstream cosign_checksums.txt for v3.1.3, verified
      # against sigstore's published file. Rotate both together on upgrade.
      - name: Install Cosign inside container
        shell: bash
        env:
          COSIGN_VERSION: "v3.1.3"
          COSIGN_SHA256: "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71"
        run: |
          set -euo pipefail
          cosign_dir=$(mktemp -d)
          trap 'rm -rf "$cosign_dir"' EXIT
          curl -sSfL -o "$cosign_dir/cosign-linux-amd64" \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  $cosign_dir/cosign-linux-amd64" | sha256sum -c -
          install -m 0755 "$cosign_dir/cosign-linux-amd64" /usr/local/bin/cosign

      - name: Run goreleaser (snapshot/dry-run)
        if: inputs.dry_run
        env:
          UI_BUILD_HASH: ${{ needs.build-ui.outputs.ui_hash }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --snapshot --clean --skip=publish,announce

      - name: Run goreleaser (publish)
        if: ${{ !inputs.dry_run }}
        env:
          UI_BUILD_HASH: ${{ needs.build-ui.outputs.ui_hash }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --skip=validate: the UI build downloaded into internal/api/ui/
        # overwrites the tracked .gitkeep stub, which goreleaser would
        # otherwise flag as "git is in a dirty state". PR-level CI validates
        # the same content via the dry-run snapshot.
        run: goreleaser release --clean --skip=validate

      - name: Hand the darwin archive and checksums to macos-pkg
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-pkg-inputs
          path: |
            dist/trellis-*-darwin-arm64.tar.gz
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 1

      - name: Upload dry-run artifact bundle for inspection
        if: inputs.dry_run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goreleaser-dryrun-${{ github.run_id }}
          path: dist/
          retention-days: 14

  # =========================================================================
  # macOS .pkg — built from goreleaser's darwin archive, so the installer
  # carries the same binary the archive does. On a real release it is signed,
  # notarized, SBOM'd and cosign-signed like the other artifacts, appended to
  # checksums.txt, and the final manifest is re-signed and becomes the
  # provenance subject list. The release is still a draft here; provenance
  # publishes it. A dry run builds the package ad hoc signed and uploads it
  # for inspection.
  # =========================================================================
  macos-pkg:
    name: macOS .pkg
    if: ${{ !inputs.provenance_only }}
    needs: [goreleaser]
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write # cosign keyless OIDC
    outputs:
      # base64 of the final checksums.txt, the subject-checksums input of
      # the provenance job. Set only on a real (non-snapshot) release.
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the darwin archive and checksums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-pkg-inputs
          path: ${{ runner.temp }}/macos-pkg-inputs/

      - name: Import signing identities
        if: ${{ !inputs.dry_run || inputs.sign_macos }}
        shell: bash
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${P12_BASE64}" ] || [ -z "${P12_PASSWORD}" ]; then
            echo "::error::MACOS_SIGNING_P12_BASE64 / MACOS_SIGNING_P12_PASSWORD are not set. An unsigned Trellis.app cannot read Wi-Fi network names, so a release without them is refused."
            exit 1
          fi
          keychain="${RUNNER_TEMP}/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "${P12_BASE64}" | base64 --decode > "${RUNNER_TEMP}/signing.p12"
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 3600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          security import "${RUNNER_TEMP}/signing.p12" -k "${keychain}" -P "${P12_PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/pkgbuild
          rm -f "${RUNNER_TEMP}/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" "${keychain}" > /dev/null
          security list-keychains -d user -s "${keychain}" login.keychain-db
          security find-identity -v "${keychain}" | grep -F "Developer ID Application"
          security find-identity -v "${keychain}" | grep -F "Developer ID Installer"
          echo "KEYCHAIN=${keychain}" >> "$GITHUB_ENV"

      - name: Build the .pkg
        shell: bash
        env:
          REAL_SIGN: ${{ !inputs.dry_run || inputs.sign_macos }}
        run: |
          set -euo pipefail
          archives=("${RUNNER_TEMP}"/macos-pkg-inputs/trellis-*-darwin-arm64.tar.gz)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::expected one darwin archive, found ${#archives[@]}"
            exit 1
          fi
          name="$(basename "${archives[0]}" .tar.gz)"
          version="${name#trellis-}"
          version="${version%-darwin-arm64}"
          mkdir "${RUNNER_TEMP}/darwin"
          tar -xzf "${archives[0]}" -C "${RUNNER_TEMP}/darwin" trellisd
          if [ "${REAL_SIGN}" = "true" ]; then
            export TRELLIS_SIGN_IDENTITY="Developer ID Application"
            export TRELLIS_INSTALLER_IDENTITY="Developer ID Installer"
          else
            export TRELLIS_SIGN_IDENTITY="-"
          fi
          deploy/macos/build-pkg.sh "${RUNNER_TEMP}/darwin/trellisd" "${version}"
          echo "PKG=trellis-${version}-darwin-arm64.pkg" >> "$GITHUB_ENV"

      - name: Check the package contract
        shell: bash
        env:
          REAL_SIGN: ${{ !inputs.dry_run || inputs.sign_macos }}
        run: |
          set -euo pipefail
          expanded="${RUNNER_TEMP}/pkg-expanded"
          pkgutil --expand-full "dist/${PKG}" "${expanded}"
          app="$(find "${expanded}" -type d -name Trellis.app)"
          test "$(echo "${app}" | wc -l)" -eq 1
          # Installs to /Applications and nothing else, runs only the
          # preinstall that stops a running daemon: no launchd job, no port.
          test "$(pkgutil --payload-files "dist/${PKG}" | grep -c -E '^\./Applications/Trellis\.app$')" -eq 1
          test -f "${expanded}/Scripts/preinstall"
          test ! -e "${expanded}/Scripts/postinstall"
          test "$(pkgutil --payload-files "dist/${PKG}" | grep -c -E '^\./Library/Launch')" -eq 0
          codesign --verify --deep --strict "${app}"
          codesign -d --entitlements - "${app}" 2>&1 | grep -F "com.apple.security.personal-information.location"
          lipo -archs "${app}/Contents/MacOS/trellisd" | grep -Fx arm64
          if [ "${REAL_SIGN}" = "true" ]; then
            codesign -dvv "${app}" 2>&1 | grep -F "Authority=Developer ID Application"
            pkgutil --check-signature "dist/${PKG}" | grep -F "Developer ID Installer"
          fi

      - name: Notarize and staple the .pkg
        if: ${{ !inputs.dry_run || inputs.sign_macos }}
        shell: bash
        env:
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -z "${NOTARY_KEY_BASE64}" ] || [ -z "${NOTARY_KEY_ID}" ] || [ -z "${NOTARY_ISSUER_ID}" ]; then
            echo "::error::APPLE_NOTARY_KEY_P8_BASE64 / APPLE_NOTARY_KEY_ID / APPLE_NOTARY_ISSUER_ID are not set; an un-notarized package is refused by Gatekeeper on every other Mac."
            exit 1
          fi
          key="${RUNNER_TEMP}/notary.p8"
          echo "${NOTARY_KEY_BASE64}" | base64 --decode > "${key}"
          trap 'rm -f "${key}"' EXIT
          # notarytool exits 0 for an Invalid submission, so read the verdict.
          xcrun notarytool submit "dist/${PKG}" --key "${key}" --key-id "${NOTARY_KEY_ID}" \
            --issuer "${NOTARY_ISSUER_ID}" --wait --output-format json > "${RUNNER_TEMP}/notary.json"
          cat "${RUNNER_TEMP}/notary.json"
          test "$(jq -r .status "${RUNNER_TEMP}/notary.json")" = "Accepted"
          # Stapling rewrites the package, so it runs before the SBOM, the
          # signatures and the checksum are taken.
          xcrun stapler staple "dist/${PKG}"
          xcrun stapler validate "dist/${PKG}"
          spctl --assess --type install --verbose=2 "dist/${PKG}"

      - name: Remove the signing keychain
        if: ${{ always() && (!inputs.dry_run || inputs.sign_macos) }}
        shell: bash
        run: security delete-keychain "${KEYCHAIN:-${RUNNER_TEMP}/signing.keychain-db}" || true

      - name: Upload dry-run .pkg for inspection
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-pkg-dryrun-${{ github.run_id }}
          path: dist/${{ env.PKG }}
          if-no-files-found: error
          retention-days: 14

      - name: Install Syft and Cosign
        if: ${{ !inputs.dry_run }}
        # Same versions as the goreleaser job, darwin arm64 builds, each
        # checked against the upstream checksums file. Rotate together.
        env:
          SYFT_VERSION: "1.46.0"
          SYFT_SHA256: "cd4e2c40e075684a5746d8959f76b6572bb2d2dda8cf6877dbfff1cc0baeea01"
          COSIGN_VERSION: "v3.1.3"
          COSIGN_SHA256: "5cf948c2f4dfe59687bdd0b8523709067383e03982cc543475c8a7dc70e92a76"
        shell: bash
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/bin"
          mkdir -p "${bin}"
          curl -sSfL -o "${RUNNER_TEMP}/syft.tar.gz" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_darwin_arm64.tar.gz"
          echo "${SYFT_SHA256}  ${RUNNER_TEMP}/syft.tar.gz" | shasum -a 256 -c -
          tar -xzf "${RUNNER_TEMP}/syft.tar.gz" -C "${bin}" syft
          curl -sSfL -o "${bin}/cosign" \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-darwin-arm64"
          echo "${COSIGN_SHA256}  ${bin}/cosign" | shasum -a 256 -c -
          chmod 0755 "${bin}/syft" "${bin}/cosign"
          echo "${bin}" >> "$GITHUB_PATH"

      - name: SBOM, sign, and publish the .pkg
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          cp "${RUNNER_TEMP}/macos-pkg-inputs/checksums.txt" checksums.txt
          SYFT_FILE_METADATA_CATALOGER_ENABLED=true \
            syft "${PKG}" --output "spdx-json=${PKG}.sbom.json"
          cosign sign-blob --yes --bundle "${PKG}.cosign.bundle" "${PKG}"
          cosign sign-blob --yes --bundle "${PKG}.sbom.json.cosign.bundle" "${PKG}.sbom.json"
          shasum -a 256 "${PKG}" "${PKG}.sbom.json" >> checksums.txt
          cosign sign-blob --yes --bundle checksums.txt.cosign.bundle checksums.txt
          gh release upload "${REF_NAME}" --clobber --repo "${GITHUB_REPOSITORY}" \
            checksums.txt checksums.txt.cosign.bundle \
            "${PKG}" "${PKG}.sbom.json" "${PKG}.cosign.bundle" "${PKG}.sbom.json.cosign.bundle"
          grep -Fq "  ${PKG}" checksums.txt
          grep -Fq "  ${PKG}.sbom.json" checksums.txt
          test -s "${PKG}.sbom.json"
          test -s "${PKG}.cosign.bundle"
          test -s "${PKG}.sbom.json.cosign.bundle"

      - name: Capture artifact hashes for SLSA provenance
        if: ${{ !inputs.dry_run }}
        id: hashes
        shell: bash
        run: |
          # checksums.txt is in "<sha256>  <filename>" form, the
          # subject-checksums format, and now lists every release artifact.
          set -euo pipefail
          echo "hashes=$(base64 < dist/checksums.txt | tr -d '\n')" >> "$GITHUB_OUTPUT"

  # =========================================================================
  # SLSA provenance backfill — recomputes the subject list from a tag's
  # already-published checksums.txt instead of running goreleaser. Used
  # to retroactively attest tags that shipped before the provenance job
  # existed. Only fires under workflow_dispatch with provenance_only=true;
  # on a push or normal dispatch this job is skipped and `macos-pkg`
  # feeds the provenance job.
  # =========================================================================
  goreleaser-backfill-hashes:
    name: goreleaser (backfill subjects from existing release)
    if: ${{ inputs.provenance_only }}
    runs-on: ubuntu-latest
    outputs:
      # Same base64-subjects contract as the macos-pkg job's `hashes`
      # output. Provenance job picks whichever upstream produced one.
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - name: Download checksums.txt from existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ inputs.target_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$TARGET_TAG" ]; then
            echo "::error::provenance_only=true requires target_tag to identify which existing release to attest"
            exit 1
          fi
          gh release download "$TARGET_TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'checksums.txt' \
            --dir .
          echo "checksums.txt contents:"
          cat checksums.txt

      - name: Convert checksums.txt to base64 subjects
        id: hashes
        shell: bash
        run: |
          # checksums.txt is the standard goreleaser format:
          #   <sha256>  <filename>
          # The attest-build-provenance `subject-checksums` input takes
          # exactly that format. We base64-encode here so the output
          # contract matches the goreleaser job's `hashes` output.
          set -euo pipefail
          hashes=$(base64 -w0 < checksums.txt)
          echo "hashes=${hashes}" >> "$GITHUB_OUTPUT"

  # =========================================================================
  # SLSA L3 provenance — runs on real releases (not dry-run).
  #
  # Uses GitHub's first-party actions/attest-build-provenance, which
  # produces a SLSA L3 in-toto attestation (signed via Sigstore keyless
  # OIDC), surfaces it on the release's GitHub Attestations panel, and
  # attaches the bundle file to the release as a downloadable asset.
  # Mirrors seed/stem/niac's provenance job.
  #
  # Two upstream paths feed this job (only one runs per invocation):
  #   - normal release:  needs.macos-pkg produces subjects from the final checksums.txt
  #   - provenance_only: needs.goreleaser-backfill-hashes produces subjects
  #                      from the existing release's checksums.txt
  # =========================================================================
  provenance:
    name: SLSA provenance
    # Skip on dry-run snapshots; require one of the two upstreams to have
    # succeeded. `!cancelled()` lets this job run even though one of the
    # two `needs` is intentionally skipped per dispatch path.
    if: ${{ !inputs.dry_run && !cancelled() && (needs.macos-pkg.result == 'success' || needs.goreleaser-backfill-hashes.result == 'success') }}
    needs: [macos-pkg, goreleaser-backfill-hashes]
    runs-on: ubuntu-latest
    permissions:
      id-token: write       # Sigstore OIDC signing
      contents: write       # uploading the bundle to the release
      attestations: write   # GitHub Attestations API
    steps:
      - name: Decode artifact subjects
        id: subjects
        shell: bash
        run: |
          set -euo pipefail
          # Pick whichever upstream ran. The unused one is empty.
          echo "${{ needs.macos-pkg.outputs.hashes || needs.goreleaser-backfill-hashes.outputs.hashes }}" \
            | base64 -d > subjects.txt
          echo "Subjects:"
          cat subjects.txt

      - name: Generate SLSA build-provenance attestation
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: subjects.txt

      - name: Attach attestation bundle to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ inputs.target_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.attest.outputs.bundle-path }}" \
             trellis-slsa-provenance.intoto.jsonl
          gh release upload "$TARGET_TAG" \
             trellis-slsa-provenance.intoto.jsonl --clobber --repo "${GITHUB_REPOSITORY}"

      # Last step on purpose: publishing makes the release immutable, so every
      # asset, the attestation included, must already be on the draft. A
      # provenance-only backfill targets a release that is already published.
      - name: Publish the completed release
        if: ${{ !inputs.provenance_only }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TARGET_TAG" --draft=false --repo "${GITHUB_REPOSITORY}"
