# =============================================================================
# Release (goreleaser)
# =============================================================================
# Canonical release pipeline. Drives .goreleaser.yml inside the
# goreleaser-cross container.
#
# Triggers:
#   - push to a v* tag: real release - builds, signs, publishes
#   - workflow_dispatch with dry_run=true: snapshot only - no publish, no
#     signing; artifacts uploaded for inspection
#   - workflow_dispatch with provenance_only=true (ref=<existing tag>):
#     skips goreleaser entirely, recomputes artifact subjects from the
#     already-published checksums.txt on that tag's GitHub release, then
#     runs attest-build-provenance + uploads the .intoto.jsonl. Used to
#     retroactively attest tags that shipped before the provenance job
#     existed. provenance_only takes precedence over dry_run.
#
# Mirrors seed/stem/niac's release.yml shape so all four projects converge
# on the same release tooling. Unlike stem, there is no native C dataplane
# to build and no nfpm .deb/.rpm block — Trellis ships archives only (see
# .goreleaser.yml for the reasoning).
#
# Inputs: only the typed `dry_run` boolean - no untrusted event fields
# are interpolated into shell commands.
# =============================================================================

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Snapshot build only - do not publish or sign"
        type: boolean
        default: true
      provenance_only:
        description: "Backfill: skip build, recompute subjects from the existing release's checksums.txt, attest + upload bundle"
        type: boolean
        default: false
      target_tag:
        description: "Backfill target tag (e.g. v0.1.0). Required when provenance_only=true — workflow_dispatch must be issued against main since older tags don't have these inputs."
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A v* tag is enough to start a release: no ruleset restricts tag creation in
  # any fleet repo (verified 2026-08-27 — the only ruleset present is
  # merge-queue, and it targets branches). Until tag protection lands, this is
  # the gate. It refuses to build a tag whose commit never passed CI, so an
  # accidental or unauthorised tag fails here instead of producing signed,
  # published artifacts.
  #
  # The assertion is skipped for workflow_dispatch, which is the deliberate
  # dry-run path and carries no tag — but the job itself still runs and
  # succeeds, so nothing downstream is skipped.
  verify-tag:
    name: Verify tagged commit passed CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
    steps:
      # The condition is on the step, not the job. A job-level `if:` that
      # evaluated false would leave this SKIPPED, and a skipped `needs:` entry
      # skips everything downstream through the implicit success() — the whole
      # dry-run path would silently do nothing. As a step, the job still
      # reports success and dependents run normally.
      - name: Assert CI Complete succeeded for this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # index() returns 0 for a first-element match, and jq's // only fires
          # on null/false — so a match at position 0 still prints 0 and passes.
          found=$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "CI Complete") | .conclusion] | index("success") // empty')
          if [ -z "$found" ]; then
            echo "::error::No successful 'CI Complete' check run for ${GITHUB_SHA}. Refusing to release an unvalidated commit."
            exit 1
          fi
          echo "CI Complete succeeded for ${GITHUB_SHA}"

  # =========================================================================
  # UI build - done outside the goreleaser-cross container because that
  # image is Go-focused and doesn't ship Node. Vite writes directly to
  # internal/api/ui/; the next job inherits the workspace.
  # =========================================================================
  build-ui:
    name: Build UI
    if: ${{ !inputs.provenance_only }}
    needs: [verify-tag]
    runs-on: ubuntu-latest
    outputs:
      ui_hash: ${{ steps.ui-hash.outputs.hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        # The Node/npm pin lives in the composite action, same as ci.yml, so
        # the release path cannot drift from what CI tested against.
        uses: ./.github/actions/setup-node
        with:
          # No npm cache on the release path. This job's output is published
          # and attested, so a poisoned cache entry restored from a branch
          # would land in a signed artifact. CI keeps its cache; releases
          # always resolve from the registry.
          cache: ""

      - name: Build UI
        run: |
          cd ui
          npm ci
          npm run build

      - name: Compute UI build hash
        id: ui-hash
        run: |
          # The same script the Makefile, the macOS bundle and the E2E daemon
          # use, so a released binary and a `make build` agree on the hash.
          UI_BUILD_HASH=$(./scripts/ui-build-hash.sh)
          echo "hash=$UI_BUILD_HASH" >> "$GITHUB_OUTPUT"

      - name: Upload UI dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-dist
          path: internal/api/ui/
          retention-days: 1
          include-hidden-files: true

  # =========================================================================
  # goreleaser build + (when not dry-run) publish.
  # =========================================================================
  goreleaser:
    name: goreleaser
    if: ${{ !inputs.provenance_only }}
    runs-on: ubuntu-latest
    needs: [build-ui]
    permissions:
      contents: write
      id-token: write # cosign keyless OIDC
    container:
      # Docker Hub tag scheme: <go-version>-<goreleaser-version>. v1.26.5
      # tracks Go 1.26.5 + goreleaser v2.17.1. Pinned for reproducibility;
      # bump when newer revs land. Keep fresh so the image's baked libs
      # don't drift from upstream (seed#1577).
      image: goreleaser/goreleaser-cross:v1.27.0@sha256:3ce3506ee9179c4122ba0b5dc13ab564ff259fb65f45bfad005ddd5e4a3d326d
    outputs:
      # base64-encoded SHA-256 hashes of all release artifacts, formatted
      # for slsa-github-generator's base64-subjects input. Set only on a
      # real (non-snapshot) release.
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Mark workspace as safe (container runs as root)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download UI dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: internal/api/ui/

      - name: Install Syft (SBOM) inside container
        env:
          # Pinned version + checksum (from syft's published checksums.txt),
          # matching seed/stem's pattern — `curl ... install.sh | sh` from
          # the mutable `main` branch is a supply-chain risk (a compromised
          # main would run arbitrary code in the release container). Rotate
          # together on upgrade.
          SYFT_VERSION: "1.46.0"
          SYFT_SHA256: "d654f678b709eb53c393d38519d5ed7d2e57205529404018614cfefa0fb2b5ca"
        # Container run steps default to `sh` (dash), which rejects
        # `set -o pipefail`; force bash (present in goreleaser-cross).
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL -o syft.tar.gz \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  syft.tar.gz" | sha256sum -c -
          tar -xzf syft.tar.gz -C /usr/local/bin syft
          chmod +x /usr/local/bin/syft

      # Downloaded and executed in a job holding contents: write and
      # id-token: write, so an unverified binary here signs the release. Syft
      # two steps above was already checksummed; cosign was the outlier.
      # Checksum from the upstream cosign_checksums.txt for v3.1.3, verified
      # against sigstore's published file. Rotate both together on upgrade.
      - name: Install Cosign inside container
        shell: bash
        env:
          COSIGN_VERSION: "v3.1.3"
          COSIGN_SHA256: "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71"
        run: |
          set -euo pipefail
          cosign_dir=$(mktemp -d)
          trap 'rm -rf "$cosign_dir"' EXIT
          curl -sSfL -o "$cosign_dir/cosign-linux-amd64" \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  $cosign_dir/cosign-linux-amd64" | sha256sum -c -
          install -m 0755 "$cosign_dir/cosign-linux-amd64" /usr/local/bin/cosign

      - name: Run goreleaser (snapshot/dry-run)
        if: inputs.dry_run
        env:
          UI_BUILD_HASH: ${{ needs.build-ui.outputs.ui_hash }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --snapshot --clean --skip=publish,announce

      - name: Run goreleaser (publish)
        if: ${{ !inputs.dry_run }}
        env:
          UI_BUILD_HASH: ${{ needs.build-ui.outputs.ui_hash }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --skip=validate: the UI build downloaded into internal/api/ui/
        # overwrites the tracked .gitkeep stub, which goreleaser would
        # otherwise flag as "git is in a dirty state". PR-level CI validates
        # the same content via the dry-run snapshot.
        run: goreleaser release --clean --skip=validate

      - name: Capture artifact hashes for SLSA provenance
        if: ${{ !inputs.dry_run }}
        id: hashes
        shell: bash
        run: |
          # goreleaser drops artifacts.json describing every produced
          # artifact. Filter to the user-facing ones (archive type) and
          # base64-encode their SHA-256 list for the slsa-github-generator
          # reusable workflow.
          set -euo pipefail
          hashes=$(jq -r '
            map(select(.type == "Archive")) |
            map("\(.extra.Checksum | sub("^sha256:"; ""))  \(.name)") |
            join("\n")
          ' dist/artifacts.json | base64 -w0)
          echo "hashes=${hashes}" >> "$GITHUB_OUTPUT"

      - name: Upload dry-run artifact bundle for inspection
        if: inputs.dry_run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: goreleaser-dryrun-${{ github.run_id }}
          path: dist/
          retention-days: 14

  # =========================================================================
  # SLSA provenance backfill — recomputes the subject list from a tag's
  # already-published checksums.txt instead of running goreleaser. Used
  # to retroactively attest tags that shipped before the provenance job
  # existed. Only fires under workflow_dispatch with provenance_only=true;
  # on a push or normal dispatch this job is skipped and the regular
  # `goreleaser` job feeds the provenance job.
  # =========================================================================
  goreleaser-backfill-hashes:
    name: goreleaser (backfill subjects from existing release)
    if: ${{ inputs.provenance_only }}
    runs-on: ubuntu-latest
    outputs:
      # Same base64-subjects contract as the goreleaser job's `hashes`
      # output. Provenance job picks whichever upstream produced one.
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - name: Download checksums.txt from existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ inputs.target_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$TARGET_TAG" ]; then
            echo "::error::provenance_only=true requires target_tag to identify which existing release to attest"
            exit 1
          fi
          gh release download "$TARGET_TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'checksums.txt' \
            --dir .
          echo "checksums.txt contents:"
          cat checksums.txt

      - name: Convert checksums.txt to base64 subjects
        id: hashes
        shell: bash
        run: |
          # checksums.txt is the standard goreleaser format:
          #   <sha256>  <filename>
          # The attest-build-provenance `subject-checksums` input takes
          # exactly that format. We base64-encode here so the output
          # contract matches the goreleaser job's `hashes` output.
          set -euo pipefail
          hashes=$(base64 -w0 < checksums.txt)
          echo "hashes=${hashes}" >> "$GITHUB_OUTPUT"

  # =========================================================================
  # SLSA L3 provenance — runs on real releases (not dry-run).
  #
  # Uses GitHub's first-party actions/attest-build-provenance, which
  # produces a SLSA L3 in-toto attestation (signed via Sigstore keyless
  # OIDC), surfaces it on the release's GitHub Attestations panel, and
  # attaches the bundle file to the release as a downloadable asset.
  # Mirrors seed/stem/niac's provenance job.
  #
  # Two upstream paths feed this job (only one runs per invocation):
  #   - normal release:  needs.goreleaser produces subjects from artifacts.json
  #   - provenance_only: needs.goreleaser-backfill-hashes produces subjects
  #                      from the existing release's checksums.txt
  # =========================================================================
  provenance:
    name: SLSA provenance
    # Skip on dry-run snapshots; require one of the two upstreams to have
    # succeeded. `!cancelled()` lets this job run even though one of the
    # two `needs` is intentionally skipped per dispatch path.
    if: ${{ !inputs.dry_run && !cancelled() && (needs.goreleaser.result == 'success' || needs.goreleaser-backfill-hashes.result == 'success') }}
    needs: [goreleaser, goreleaser-backfill-hashes]
    runs-on: ubuntu-latest
    permissions:
      id-token: write       # Sigstore OIDC signing
      contents: write       # uploading the bundle to the release
      attestations: write   # GitHub Attestations API
    steps:
      - name: Decode artifact subjects
        id: subjects
        shell: bash
        run: |
          set -euo pipefail
          # Pick whichever upstream ran. The unused one is empty.
          echo "${{ needs.goreleaser.outputs.hashes || needs.goreleaser-backfill-hashes.outputs.hashes }}" \
            | base64 -d > subjects.txt
          echo "Subjects:"
          cat subjects.txt

      - name: Generate SLSA build-provenance attestation
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: subjects.txt

      - name: Attach attestation bundle to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ inputs.target_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.attest.outputs.bundle-path }}" \
             trellis-slsa-provenance.intoto.jsonl
          gh release upload "$TARGET_TAG" \
             trellis-slsa-provenance.intoto.jsonl --clobber --repo "${GITHUB_REPOSITORY}"
