# Shared callers (changes, backend, race, frontend, storybook, e2e) pin
# MustardSeedNetworks/.github at e092081a97245d29978e229be7425179cc1dcde1.
# That commit pins apt-install and flake-budget inside the called workflows,
# so this repo does not vendor them. CI Complete stays a job in this file:
# the shared aggregator would publish `ci-complete / CI Complete`, and branch
# protection plus release.yml require the bare name.
name: CI

on:
  pull_request:
    branches: [main]
  # Required for the merge queue: `CI Complete` is a required status check, so
  # it must report on merge_group events too. Without this the queue accepts a
  # PR and then waits forever for a check that never fires.
  merge_group:
  workflow_dispatch:

concurrency:
  # This workflow does not run on push to main. A merge-queue burst used to
  # push several commits within minutes; GitHub keeps one pending run per
  # concurrency group and cancels the older, so intermediate main runs died
  # queued and release-please (gated on workflow_run success) skipped them.
  # Pushes to main now run ci-smoke.yml, one group per commit, which is the
  # success release-please waits for. The full suite already ran in the
  # merge queue on the merged result.
  #
  # The SHA key stays: the fleet conformance check requires github.sha in
  # this group, and a workflow_dispatch on main must not cancel another.
  # Superseded PR runs are still waste and still get cancelled.
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Changed paths — the filter every expensive job keys off
  # ===========================================================================
  # Fleet parity with seed's ci.yml. Before this job every one of the jobs
  # below ran on every PR, so a one-line docs edit paid for the Go backends,
  # Playwright and Storybook. The org is on the GitHub Free plan (20
  # concurrent hosted jobs), which is the concrete cost.
  #
  # The matcher is scripts/ci-changes.py in the pinned .github commit. On
  # merge_group every declared filter is true: the queue has no PR base to
  # diff against. pull_request still filters. id-token: write is how that
  # workflow reads its own commit; without it the job fails closed.
  changes:
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    uses: MustardSeedNetworks/.github/.github/workflows/ci-changes.yml@e092081a97245d29978e229be7425179cc1dcde1 # .github#163
    with:
      filters: |
        backend:
          - '**/*.go'
          - 'go.mod'
          - 'go.sum'
          - 'Makefile'
          - 'mk/**'
          # The proto is the API contract and gen/ is what the Go and TS
          # sides compile against; buf lint runs inside the backend job.
          - 'proto/**'
          - 'gen/**'
          # The TS half of the generated tree lives under ui/, so `ui/**`
          # alone would route a hand-edited generated file to the frontend
          # job and skip the drift gate, which runs here.
          - 'ui/src/gen/**'
          - 'buf*.yaml'
          # protoc-gen-es stamps its version into every generated file, so a
          # generator bump changes only these two. Without them the drift gate
          # skipped on the PR and first ran in the merge queue (trellis#731,
          # ejected 294 times).
          - 'ui/package.json'
          - 'ui/package-lock.json'
        frontend:
          - 'ui/**'
          - 'gen/**'
        docs:
          - '**/*.md'
        # Everything that *implements* a gate, not just the workflow that
        # calls it. Naming scripts one at a time is the failure mode: a PR
        # could rewrite scripts/check-theme-contract.py, run no job that
        # used it, and merge green — CI Complete accepts `skipped`.
        ci_infra:
          - '.github/workflows/**'
          - '.github/actions/**'
          - 'scripts/**'
          - '.golangci.yml'
          - 'ui/biome.json'
          - '.markdownlint.json'
          - '.markdownlint-cli2.jsonc'
          - '.pre-commit-config.yaml'

  # ===========================================================================
  # UI bundle shared with the E2E daemon
  # ===========================================================================
  # ci-frontend typechecks and tests. It does not produce the production
  # bundle. The Playwright image has no Go toolchain, so the daemon is built
  # on ubuntu-24.04 from this artifact rather than by `make build-e2e` inside
  # the browser job. backend and race compile against the tracked .gitkeep
  # stub and do not download it.
  build-ui:
    name: Build UI (shared artifact)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci_infra == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Build the UI bundle
        # `make ui` is the bundle `make build` embeds. A raw `npm run build`
        # skips the clean of internal/api/ui, and a dirty directory changes
        # the hash the daemon stamps.
        run: make ui

      - name: Upload built UI assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: internal/api/ui/
          retention-days: 1
          if-no-files-found: error

  # ===========================================================================
  # Backend (Go, macOS, Windows) — fleet-shared ci-backend.yml
  # ===========================================================================
  # One caller. Linux is build, vet, gofmt, golangci-lint, buf lint, the
  # generated-code drift gate, tests, and the coverage floor. Race detection
  # is the race caller: this test command is the coverage run, and the two
  # cannot share one `go test` once they are different workflows.
  #
  # macOS builds and vets the tree, race-tests internal/capture, checks that
  # cgo stays in that package, and builds again with CGO_ENABLED=0. Windows
  # race-tests the capture backend and the daemon against the real ABI.
  # Both stay off pull_request (skip-native-on-pull-request defaults true).
  # The merge queue still runs them, because changes forces every filter true
  # there. CGO_ENABLED=1 on Windows: `go test -race` refuses cgo off, and the
  # capture backend is pure Go but the race runtime is not.
  #
  # lint-windows stays false. The shared job lints the whole tree with
  # GOOS=windows on every event and has no only-new-issues input. This repo
  # has not had that CI gate; `make lint` still runs the Windows pass locally.
  #
  # No libpcap. Trellis does not link it. Node is for `npx --package` in
  # buf.gen.ui.yaml. npm ci is the install this job ran before
  # `make check-generated`; the generator version comes from that file, not
  # from node_modules.
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci_infra == 'true'
    permissions:
      contents: read
      actions: read
    uses: MustardSeedNetworks/.github/.github/workflows/ci-backend.yml@e092081a97245d29978e229be7425179cc1dcde1 # .github#163
    with:
      install-libpcap: false
      setup-node: true
      ui-install: true
      # ci-conformance.yml reads the linter version from this file: it greps
      # `golangci/golangci-lint-action@` and a `version: vX.Y.Z` within six
      # lines. The action runs inside ci-backend.yml. The next line is the
      # version that workflow is given, and the string the grep matches.
      # golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      golangci-lint-version: v2.14.0
      golangci-lint-args: --timeout=5m
      lint-windows: false
      cgo-enabled-windows: "1"
      fetch-depth: 1
      native-fetch-depth: 1
      timeout-minutes: 20
      build-command: go build ./...
      darwin-test-command: |
        go test -race ./internal/capture/...
        python3 scripts/check-cgo-confinement.py
        CGO_ENABLED=0 go build ./...
      windows-test-command: go test -race ./internal/capture/... ./cmd/trellisd/...
      extra-command: |
        make fmt-check
        make check-generated
        "$(go env GOPATH)/bin/buf" lint
      test-command: |
        go test -covermode=atomic -coverprofile=coverage.out ./...
        sed -i '\|^github.com/MustardSeedNetworks/trellis/gen/|d' coverage.out
      coverage-command: |
        COVERAGE=$(go tool cover -func=coverage.out | grep total: | awk '{print $3}' | sed 's/%//')
        echo "Current coverage: ${COVERAGE}%"
        # Anti-regression floor, not an aspiration. Handwritten code (gen/
        # excluded above) measured 80.1% on Linux under Go 1.27.2, so 75
        # leaves roughly five points of headroom for ordinary refactoring
        # while still catching a real drop. The fleet minimum is 50; setting
        # it there would leave a 30-point hole a regression could fall
        # through unnoticed.
        #
        # Go 1.27.1 over-counted statements in straight-line blocks (a
        # one-line `if` reported as 9), which read the same tree as 65.2%
        # where 1.27.2 reads 59.3% with gen/ included. Compare numbers only
        # within one toolchain.
        #
        # This command used to run under -race. The race detector is the race
        # caller now; -covermode=atomic keeps the same counter mode the floor
        # was measured with. Ratchet plan (#235): raise as coverage rises.
        # Never lower it to make a red build green.
        #   2026-Q4: 75 (current)
        #   2027-Q2: 80
        MIN_COVERAGE=75
        below=$(echo "$COVERAGE < $MIN_COVERAGE" | bc -l)
        case "$below" in
          1*)
            echo "::error::Coverage ${COVERAGE}% is below the minimum of ${MIN_COVERAGE}%"
            exit 1
            ;;
        esac
        {
          echo "### Go coverage"
          echo
          echo '```'
          go tool cover -func=coverage.out | tail -n 20
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # Go race detector — fleet-shared ci-race.yml
  # ===========================================================================
  # The coverage run above does not pass -race. This is the run that used to
  # be `go test -race` on Linux, over the whole module. No libpcap. The suite
  # does not read SKIP_NETWORK_TESTS; the shared default would export it.
  race:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci_infra == 'true'
    permissions:
      contents: read
      actions: read
    uses: MustardSeedNetworks/.github/.github/workflows/ci-race.yml@e092081a97245d29978e229be7425179cc1dcde1 # .github#163
    with:
      install-libpcap: false
      skip-network-tests: false
      timeout-minutes: 20
      test-command: go test -race ./...

  # ===========================================================================
  # Frontend — fleet-shared ci-frontend.yml
  # ===========================================================================
  # Defaults are `npx tsc --build --noEmit` and `npm run lint`. Token
  # discipline runs before the tests. `npm run build` stays in the test
  # command so a Vite failure is still this job's, including when the build
  # job is waiting on a red backend. The build job separately runs `make
  # build`, which is the release recipe, not a second copy of this one.
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci_infra == 'true'
    permissions:
      contents: read
    uses: MustardSeedNetworks/.github/.github/workflows/ci-frontend.yml@e092081a97245d29978e229be7425179cc1dcde1 # .github#163
    with:
      timeout-minutes: 15
      extra-command: ../scripts/check-token-discipline.sh
      test-command: |
        npm run test:coverage
        npm run build

  # ===========================================================================
  # Storybook — fleet-shared ci-storybook.yml
  # ===========================================================================
  # Defaults match this repo: install-deps via the called workflow's
  # apt-install, a retried Chromium download, test:storybook, and
  # test:storybook:contract. The apt-install pin lives in the called
  # workflow, not in this repo.
  storybook:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci_infra == 'true'
    permissions:
      contents: read
    uses: MustardSeedNetworks/.github/.github/workflows/ci-storybook.yml@e092081a97245d29978e229be7425179cc1dcde1 # .github#163

  # ===========================================================================
  # E2E — the UI as trellisd actually serves it. Fleet-shared ci-e2e.yml
  # ===========================================================================
  # Sharded chromium and webkit inside the pinned Playwright image. The image
  # ships the browsers, so the shard never calls apt. It also has no Go
  # toolchain, so the daemon is built here on ubuntu-24.04 with `make
  # build-e2e` (the ldflags handshake.spec.ts asserts) and the shard only
  # starts the binary. Playwright's webServer does that when E2E_SKIP_BUILD=1,
  # which the called workflow sets. There is no @smoke tag in this suite, so
  # the smoke job stays off: Playwright exits 1 when the grep matches nothing.
  #
  # Drafts still run the suite. skip-drafts defaults to true in the called
  # workflow; this repo's gate did not skip them.
  #
  # The hash grep that used to live in this job is the build job's assertion
  # on `make build`. This daemon is build-e2e, and /__version is what the
  # handshake spec reads.
  e2e:
    needs: [changes, build-ui, backend, frontend]
    if: |
      !cancelled() &&
      needs.build-ui.result == 'success' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped')
    permissions:
      contents: read
      actions: write
    uses: MustardSeedNetworks/.github/.github/workflows/ci-e2e.yml@e092081a97245d29978e229be7425179cc1dcde1 # .github#163
    with:
      skip-drafts: false
      backend-result: ${{ needs.backend.result }}
      frontend-result: ${{ needs.frontend.result }}
      playwright-image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      ui-artifact: frontend-dist
      fetch-depth: 0
      build-daemon: true
      static-libpcap: false
      daemon-build-command: |
        test -s internal/api/ui/index.html
        # The artifact is already the bundle. Satisfy make's UI prerequisites
        # without npm: this job has Go and not Node, and a rebuild would need
        # both. Touching the targets is what keeps `make build-e2e` on the
        # go build line, which is the recipe that injects the ldflags.
        mkdir -p ui/node_modules
        touch ui/node_modules internal/api/ui/index.html
        make build-e2e
        cp bin/trellisd-e2e trellisd-e2e
      daemon-binary: trellisd-e2e
      daemon-artifact: trellis-e2e-daemon
      timeout-minutes: 20
      run-smoke: false
      prepare-command: |
        mkdir -p bin
        cp trellisd-e2e bin/trellisd-e2e
        chmod +x bin/trellisd-e2e
      test-command: cd ui && npx playwright test --project="$BROWSER" --shard="$SHARD/$SHARD_COUNT"

  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enforce customer-facing vocabulary policy
        run: python3 scripts/check-banned-vocabulary.py

      - name: File-size gate (baseline-ratchet)
        run: ./scripts/check-file-size.sh

      # ADR-0006 linked capture into trellisd, so the process boundary that kept
      # the engine and capture code away from the daemon became a package one.
      # Read from source, so the darwin and windows capture files are checked
      # here too, where neither builds.
      - name: Go package layering (ADR-0001)
        run: |
          python3 scripts/test-check-layering.py
          python3 scripts/check-layering.py

      # A theme that is defined but not rendered is the failure the design
      # rollout retired grep-based validation over. This checks the direction
      # that can actually fail: every semantic class the markup uses has a
      # definition behind it.
      - name: Theme contract (semantic classes resolve)
        run: python3 scripts/check-theme-contract.py

      # Tailwind emits variants only for utilities, so `sm:` on a class from
      # `@layer components` compiles to nothing (.github#80). Trellis has no
      # such use today; the gate keeps it that way, as in its three siblings.
      - name: Variants on @layer components classes
        run: |
          python3 scripts/test-check-component-variants.py
          python3 scripts/check-component-variants.py

      # The four products each own their tsconfig, so the strictness flags
      # drift silently — a missing one never announces itself, it just checks
      # less than its sibling does.
      - name: TypeScript strictness contract
        run: python3 scripts/check-tsconfig-flags.py

      # The inner loop's selection: a reverse dependency it misses is a test
      # that silently stops running between edits.
      - name: validate-touched selection
        run: python3 scripts/test-validate-touched.py

      # Source files are exempt from the name patterns: internal/auth/credential.go
      # is a Go file implementing a Credential type, not a committed credential.
      # A secret written INTO source is caught by gitleaks and gosec G101, which
      # read contents; this check reads names and is for a .env or a .key that
      # should never have been added.
      - name: Check for sensitive files
        run: |
          SENSITIVE_FILES=$(find . -type f \( \
            -name "*.env" -o \
            -name "*.pem" -o \
            -name "*.key" -o \
            -name "*secret*" -o \
            -name "*credential*" \
          \) ! -path "./.git/*" ! -name "*.example" ! -name "*.sample" \
            ! -name "*.go" ! -name "*.ts" ! -name "*.tsx" 2>/dev/null || true)
          if [ -n "$SENSITIVE_FILES" ]; then
            echo "Sensitive files found:"
            echo "$SENSITIVE_FILES"
            exit 1
          fi
          echo "No sensitive files found"

      - name: Check for unsafe logging patterns
        run: |
          DANGEROUS_PATTERNS=(
            'log\.Print.*password'
            'log\.Print.*token'
            'log\.Print.*Authorization'
            'log\.Print.*apikey'
          )
          found=0
          for pattern in "${DANGEROUS_PATTERNS[@]}"; do
            if grep -rniE "$pattern" --include="*.go" internal/ cmd/ core/ 2>/dev/null; then
              found=1
            fi
          done
          if [ "$found" -eq 1 ]; then
            echo "::error::Potentially unsafe logging of credentials"
            exit 1
          fi
          echo "No unsafe logging patterns found"

  # ===========================================================================
  # Security Scanning
  # ===========================================================================
  # trellis gated govulncheck and Semgrep but had no secret scanning, no
  # dependency audit and no filesystem scan -- thinner than seed, stem and niac,
  # which all run the full set. Same tools, same pins, same fail-closed posture.
  # Deliberately NOT gated on `changes`, matching seed. gitleaks scans the whole
  # tree for secrets and Trivy scans the filesystem: a secret pasted into a .md
  # would otherwise reach main with only the filename check in `quality` between
  # it and the branch.
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Only for the SARIF upload below.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks scans history, not just the tip.
          fetch-depth: 0

      - uses: ./.github/actions/setup-node

      - name: Run npm audit
        working-directory: ui
        run: |
          npm ci

          # npm audit's exit code conflates "the advisory endpoint is
          # unreachable" with "there is a real finding" -- a registry outage
          # on 2026-09-04 turned this job red on unrelated PRs in seed and
          # trellis, and the log read "npm error" as if it were a dependency
          # problem. --json separates the two without parsing npm's prose: a
          # transport failure returns a top-level "error" key, a completed
          # run returns metadata.vulnerabilities. Only the former is retried
          # -- a real finding will not heal in 15 seconds, and it fails
          # immediately with no delay.
          attempts=3
          delay=5
          out=""
          for attempt in $(seq 1 "$attempts"); do
            out="$(npm audit --json --audit-level=high || true)"

            if ! jq -e 'has("error")' >/dev/null 2>&1 <<<"$out"; then
              break
            fi

            endpoint="$(jq -r '(.error.summary | select(. != "")) // .message // "registry.npmjs.org advisory endpoint"' <<<"$out")"
            if [ "$attempt" -lt "$attempts" ]; then
              echo "npm audit's advisory endpoint did not answer (attempt $attempt/$attempts): $endpoint"
              sleep "$delay"
              delay=$((delay * 3))
              continue
            fi
            echo "::error::npm audit could not reach the advisory endpoint (registry.npmjs.org) after $attempts attempts: $endpoint -- this is not a dependency finding, but the audit did not run so the gate fails rather than claiming a clean scan"
            exit 1
          done

          vulns="$(jq -e '.metadata.vulnerabilities' <<<"$out" 2>/dev/null)" || {
            echo "::error::npm audit returned no metadata.vulnerabilities -- unexpected output, failing closed"
            echo "$out"
            exit 1
          }

          high="$(jq -r '.high // 0' <<<"$vulns")"
          critical="$(jq -r '.critical // 0' <<<"$vulns")"
          total="$(jq -r '.total // 0' <<<"$vulns")"
          echo "npm audit: $total vulnerabilities found ($high high, $critical critical)"

          if [ "$((high + critical))" -gt 0 ]; then
            jq -r '(.vulnerabilities // {}) | to_entries[] | select(.value.severity == "high" or .value.severity == "critical") | "  \(.value.severity): \(.key) (\(.value.range))"' <<<"$out"
            exit 1
          fi

      # gitleaks-action needs a paid licence for organisation repos and fails
      # red without ever scanning. The MIT-licensed CLI is the same engine.
      # Verified against trellis history before this was made blocking:
      # 167 commits scanned, no leaks -- so it starts clean rather than
      # arriving with an allowlist written to hide day-one findings.
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: "8.30.0"
          # SHA-256 of gitleaks_8.30.0_linux_x64.tar.gz from the upstream
          # checksums.txt. Rotate with GITLEAKS_VERSION on upgrade.
          GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner --exit-code 1

      - name: Run Trivy vulnerability scanner
        # exit-code 0 so the SARIF is always written; the explicit check below
        # is what fails CI, so a scanner error cannot pass as "no findings".
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      # Not continue-on-error: a silent upload failure leaves the Security tab
      # showing an older scan, so the dashboard reads "clean" because nothing
      # new arrived rather than because nothing was found.
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif

      - name: Fail on CRITICAL/HIGH findings
        run: |
          set -euo pipefail
          if [ ! -f trivy-results.sarif ]; then
            echo "::error::Trivy produced no SARIF -- the scan did not run, which is a failure, not a pass"
            exit 1
          fi
          count=$(python3 -c "import json,sys; d=json.load(open('trivy-results.sarif')); print(sum(len(r.get('results',[])) for r in d.get('runs',[])))")
          echo "Trivy CRITICAL/HIGH findings: ${count}"
          if [ "$count" -gt 0 ]; then
            echo "::error::Trivy reported ${count} CRITICAL/HIGH finding(s)"
            exit 1
          fi

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci_infra == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - name: Run govulncheck
        # Pinned, not @latest. govulncheck is a hard gate per fleet policy, and
        # an unpinned gate can change behaviour with no code change — either a
        # spurious break or a silent loss of coverage. Renovate tracks this pin
        # via the customManager in MustardSeedNetworks/.github.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  i18n:
    name: i18n Validation
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci_infra == 'true'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate i18n (parity, glossary, banned vocab, etc.)
        uses: MustardSeedNetworks/.github/.github/actions/i18n-validate@d2aa4161d10bf8cb5a9ffb0e0985224df0faa617 # .github#105 + #106, untagged

  # actionlint + zizmor over .github/workflows. Ported from seed, which has had
  # this since the fleet CI pass; trellis was the one repo where a workflow
  # change went to main with nothing checking it — the same pins, the same
  # zizmor severity floor, so a finding here means the same thing it does
  # in the other three.
  #
  # No path filter: this repo has no `changes` job, and both tools finish in
  # under a minute on a tree this size.
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.ci_infra == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Run actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          # SC2129 is a pure style preference about grouping `>>` redirects in
          # step summaries; the ungrouped form stays readable and diffs one
          # line at a time. Every correctness-level rule stays enabled.
          actionlint -ignore 'SC2129' -color

      - name: Run zizmor
        env:
          # zizmor resolves action refs against the API; without a token it
          # falls back to unauthenticated requests and gets rate-limited.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pipx install zizmor==1.30.1
          zizmor --min-severity high --color always .github/workflows/

  # Fleet-shared SAST gate (MustardSeedNetworks/.github, pinned).
  semgrep:
    uses: MustardSeedNetworks/.github/.github/workflows/semgrep.yml@048d173dd72ca0f9e5fa832fb5b9fd2a6447e5e9 # v1.13.0
    permissions:
      contents: read
      # v1.8.0 publishes the all-severity SARIF to code scanning. The
      # upload is deliberately not continue-on-error, so this scope is
      # required, not optional.
      security-events: write

  # Refuses a PR that INTRODUCES a Go dependency carrying a High advisory,
  # whether or not the vulnerable symbol is ever called.
  #
  # The gap it closes is narrower than "nothing checks new dependencies", and
  # worth stating precisely: `npm audit --audit-level=high` already gates the
  # npm tree on *presence*, while govulncheck gates Go on *reachability* — it
  # passes a vulnerable module until something calls into it. The two halves of
  # the tree are held to different standards, so a Go dependency with a High
  # advisory can land unreachable and then fail CI on whatever unrelated PR
  # first calls into it. This gates the Go side on presence too, at the one
  # point where the fix is still "pick a different version". The shared
  # workflow's deny-licenses half duplicates license-check.yml — defence in
  # depth, not new coverage.
  #
  # pull_request only. The action diffs the PR's dependency manifests against
  # the base, so there is nothing for it to compare on a push or a merge_group;
  # ci-complete accepts success-or-skipped, so the skip on those events is not
  # a deadlock. Defined once in MustardSeedNetworks/.github (fleet-shared);
  # ci-complete still needs: [dependency-review].
  dependency-review:
    if: github.event_name == 'pull_request'
    uses: MustardSeedNetworks/.github/.github/workflows/dependency-review.yml@048d173dd72ca0f9e5fa832fb5b9fd2a6447e5e9 # v1.13.0
    permissions:
      contents: read
      # Only to post the findings comment when it fails.
      pull-requests: write

  # Asserts this repo's own gates are wired to gate: every job below is either
  # in ci-complete's needs or documented in .github/ci-advisory-jobs.txt, the
  # enabled linters meet the declared tier, and tool installs are pinned. Two
  # such gaps were found by hand on 2026-08-16; both arrived via a merge, which
  # is why this runs per PR rather than on a schedule.
  # Defined once in MustardSeedNetworks/.github (fleet-shared); ci-complete
  # still needs: [ci-conformance].
  # ===========================================================================
  # Documentation Quality
  # ===========================================================================
  # Trellis was the only product repo without this gate. Unlike seed's and
  # niac-go's, which lint only the files a PR touches because those trees carry
  # hundreds of pre-existing violations, this one gates the WHOLE tree: T-C1
  # cleared all 494 violations first, so there is no debt to ratchet down and a
  # changed-files scope would only let new debt in through an untouched file.
  #
  # The action bundles markdownlint-cli2; the version it bundles must equal
  # mk/lint.mk's MARKDOWNLINT_CLI2_VERSION and .pre-commit-config.yaml's rev.
  # If they drift, `make lint-md` becomes a false clear against this job —
  # MD060 landed in cli2 0.23 and an older local copy reports a clean tree.
  docs-quality:
    name: Documentation Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.ci_infra == 'true'
    # External link checking is deliberately NOT here: it walks every URL in
    # every .md file, fails on third-party link rot rather than on the change
    # under review, and already runs on a schedule in docs-link-check.yml.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint markdown (whole tree)
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          # Scope passed here, not via a "globs" key in
          # .markdownlint-cli2.jsonc: cli2 UNIONS a config "globs" entry with
          # the caller's rather than replacing it.
          globs: |
            **/*.md

  # ===========================================================================
  # Build Verification
  # ===========================================================================
  # The backend job runs a bare `go build ./...`, which proves the tree
  # compiles but produces no daemon and injects no ldflags. Universal Build
  # Contract rule 6: a CI build must mirror the Makefile recipe, or the binary
  # it produces reports uiBuildHash "unknown". This job builds trellisd the way
  # `make build` does and asserts the version metadata is actually embedded —
  # the assertion is the point, since a missing ldflag fails nothing on its own.
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, backend, frontend]
    # always() lets this evaluate when an upstream was skipped; a skipped
    # backend or frontend on a docs-only change must not drag this to failed.
    if: |
      always() &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' ||
       needs.changes.outputs.ci_infra == 'true') &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # `make build` derives VERSION from `git describe --tags`; a shallow
          # clone has no tags and would silently stamp "dev".
          fetch-depth: 0

      - uses: ./.github/actions/setup-go
      - uses: ./.github/actions/setup-node

      # No separate UI step: `make build` builds the UI itself (#405). Leaving
      # one here would mean this job could pass on a Makefile that never builds
      # the UI at all — which is exactly how #405 stayed invisible in CI while
      # a clean checkout embedded "unknown".
      - name: Build (make build — UI, ldflags and all)
        run: make build

      - name: Assert the build contract is satisfied
        # `make build` writes bin/trellisd; a binary built outside the make
        # pipeline reports uiBuildHash "unknown" and /__version cannot prove
        # the UI was embedded. Read the values back out of the binary rather
        # than trusting that the recipe ran.
        run: |
          set -euo pipefail
          test -x bin/trellisd
          expected=$(./scripts/ui-build-hash.sh)
          echo "expected uiBuildHash: ${expected}"
          if [ -z "${expected}" ] || [ "${expected}" = "unknown" ]; then
            echo "::error::ui-build-hash.sh produced no hash — the UI was not embedded"
            exit 1
          fi
          # Written to a file rather than piped into `grep -q`: grep exits as
          # soon as it matches, strings takes SIGPIPE, and under `pipefail`
          # that pipeline reports 141 — a PASS would have failed this job.
          # (`go version -m` is not an option here: -trimpath strips the
          # ldflags from the build info.)
          strings bin/trellisd > /tmp/trellisd.strings
          if ! grep -qF "${expected}" /tmp/trellisd.strings; then
            echo "::error::bin/trellisd does not carry uiBuildHash ${expected}"
            exit 1
          fi
          echo "uiBuildHash ${expected} is embedded in bin/trellisd"

  # The fleet's 390x844 check (owner 2026-09-15: everything works at phone
  # width). Trellis is the one product whose routes render without a session,
  # so it serves the built bundle statically instead of booting trellisd.
  # `routes` is every pageRegistry path; pageRegistry.test.tsx fails when the
  # two lists diverge, so a new page cannot ship unchecked.
  #
  # Pinned to the commit that landed the gate (.github#78), not v1.13.0: no
  # .github tag contains it yet, and tags there are never cut by hand. Move to
  # the next tag once one exists.
  phone-width:
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci_infra == 'true'
    permissions:
      contents: read
      id-token: write
    uses: MustardSeedNetworks/.github/.github/workflows/phone-width.yml@fb62919cfea3709a22d203a8acaf34795e3b9aff # .github#78, untagged
    with:
      dist-dir: internal/api/ui
      routes: '["/", "/import", "/coverage", "/live", "/reports"]'
      rail-testid: sidebar

  # `id-token: write` is how the reusable workflow learns which commit of
  # itself is running, so its policy checkout reads the pinned commit instead
  # of .github@main (a canonical change there reaches this repo only when this
  # pin moves).
  ci-conformance:
    uses: MustardSeedNetworks/.github/.github/workflows/ci-conformance.yml@76eb579ee0cbdef0a2aef9d9df1ae9ca38cad6bd # v1.14.0
    permissions:
      contents: read
      id-token: write

  # ============================================================================
  # CI Complete — the single required status check
  # ============================================================================
  # Matches seed, stem and niac-go. Branch protection requires this one context
  # instead of naming every job, so adding a job does not mean remembering to
  # update protection — the aggregator picks it up via `needs:`.
  #
  # `if: ${{ !cancelled() }}` so a failed upstream still reaches this
  # aggregator, while a cancelled run stays cancelled. `always()` also matches
  # cancelled, and the step below then fails the run — a superseded PR or a
  # cancelled merge-queue entry goes red instead of cancelled. Skipped counts
  # as success: path-filtered jobs legitimately do not run.
  # Fails the build on any open High/Critical CodeQL alert on the default
  # branch. The CodeQL job itself reports success when the *analysis* succeeds,
  # regardless of what it found, so without this a repository can carry open
  # High alerts with every check green. Scoped to CodeQL rather than "any High
  # alert": the code-scanning tab also carries Scorecard *scores* at High
  # severity, several of which encode deliberate decisions.
  codeql-alert-gate:
    name: CodeQL Alert Gate
    uses: MustardSeedNetworks/.github/.github/workflows/codeql-alert-gate.yml@048d173dd72ca0f9e5fa832fb5b9fd2a6447e5e9 # v1.13.0
    permissions:
      security-events: read

  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `changes` is in the needs list below because it gates every other job: if
    # the filter itself fails, every consumer skips and this aggregator would
    # otherwise pass on an empty run.
    #
    # Keep this list free of interleaved comments. The fleet conformance check
    # (MustardSeedNetworks/.github scripts/check-ci-conformance.py) parses it
    # with `^    needs:\n((?:      - \S+\n)+)`, so a comment between `needs:`
    # and the first entry makes it read the aggregator as absent and fail with
    # "nothing gates a merge".
    needs:
      - changes
      - build-ui
      - backend
      - race
      - quality
      - workflow-lint
      - govulncheck
      - security
      - frontend
      - storybook
      - e2e
      - i18n
      - semgrep
      - dependency-review
      - ci-conformance
      - codeql-alert-gate
      - docs-quality
      - build
      - phone-width
    if: ${{ !cancelled() }}
    steps:
      - name: Verify upstream results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "Upstream job results:"
          echo "$RESULTS" | jq '.'
          if ! echo "$RESULTS" | jq -e 'to_entries | map(.value.result) | all(. == "success" or . == "skipped")' >/dev/null; then
            echo "::error::One or more required CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All required CI jobs passed (or were intentionally skipped)."
