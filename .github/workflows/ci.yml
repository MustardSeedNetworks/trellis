name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Go-only CI for now. The fleet-shared reusable license-check/semgrep
  # workflows (MustardSeedNetworks/.github) assume a ui/ npm project; wire
  # those in once Trellis grows its UI. govulncheck is a hard gate per fleet
  # policy.
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          # The repo ships .golangci.yml and `make lint` runs it, but CI never
          # did — the other three products have gated on it for months. Full
          # tree verified clean (0 issues) before this gate was added.
          args: --timeout=5m

      - name: Buf lint
        # Pinned rather than floating: `make lint` runs bare `buf lint` against
        # whatever the developer has installed, so CI is the only place the
        # version is nailed down.
        run: go run github.com/bufbuild/buf/cmd/buf@v1.72.0 lint

  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enforce customer-facing vocabulary policy
        run: python3 scripts/check-banned-vocabulary.py

      - name: File-size gate (baseline-ratchet)
        run: ./scripts/check-file-size.sh

      - name: Check for sensitive files
        run: |
          SENSITIVE_FILES=$(find . -type f \( \
            -name "*.env" -o \
            -name "*.pem" -o \
            -name "*.key" -o \
            -name "*secret*" -o \
            -name "*credential*" \
          \) ! -path "./.git/*" ! -name "*.example" ! -name "*.sample" 2>/dev/null || true)
          if [ -n "$SENSITIVE_FILES" ]; then
            echo "Sensitive files found:"
            echo "$SENSITIVE_FILES"
            exit 1
          fi
          echo "No sensitive files found"

      - name: Check for unsafe logging patterns
        run: |
          DANGEROUS_PATTERNS=(
            'log\.Print.*password'
            'log\.Print.*token'
            'log\.Print.*Authorization'
            'log\.Print.*apikey'
          )
          found=0
          for pattern in "${DANGEROUS_PATTERNS[@]}"; do
            if grep -rniE "$pattern" --include="*.go" internal/ cmd/ core/ 2>/dev/null; then
              found=1
            fi
          done
          if [ "$found" -eq 1 ]; then
            echo "::error::Potentially unsafe logging of credentials"
            exit 1
          fi
          echo "No unsafe logging patterns found"

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  frontend:
    name: Frontend (React/TS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node

      - name: Install
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Test (Vitest)
        run: npm run test

      - name: Build (tsc strict + vite)
        run: npm run build

  # Fleet-shared SAST gate (MustardSeedNetworks/.github, pinned).
  semgrep:
    uses: MustardSeedNetworks/.github/.github/workflows/semgrep.yml@762b756e6fb5803443b9bcfdba03b88596c18e04 # v1.0.0
    permissions:
      contents: read
