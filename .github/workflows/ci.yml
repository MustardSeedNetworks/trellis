name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Required for the merge queue: `CI Complete` is a required status check, so
  # it must report on merge_group events too. Without this the queue accepts a
  # PR and then waits forever for a check that never fires.
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never on main. A cancelled run is not a failed one, but release-please is
  # gated on `workflow_run.conclusion == 'success'`, so a run cancelled by the
  # next merge makes the release silently not happen — no red check, just a
  # missing tag. That is exactly how stem's v0.24.47 went missing while its
  # three siblings released from the same batch.
  #
  # Superseded PR runs are still waste and still get cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Go-only CI for now. The fleet-shared reusable license-check/semgrep
  # workflows (MustardSeedNetworks/.github) assume a ui/ npm project; wire
  # those in once Trellis grows its UI. govulncheck is a hard gate per fleet
  # policy.
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        # -covermode=atomic because the suite runs under -race: the default
        # set/count modes are not race-safe, and a coverage counter data race
        # would be reported as a test failure rather than as a coverage problem.
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total: | awk '{print $3}' | sed 's/%//')
          echo "Current coverage: ${COVERAGE}%"

          # Anti-regression floor, not an aspiration. Measured coverage on Linux
          # at the commit this gate was added was 67.4% (identical with and
          # without -race), so 62 leaves roughly five points of headroom for
          # ordinary refactoring while still catching a real drop. The fleet
          # minimum is 50; setting it there would leave a 17-point hole a
          # regression could fall through unnoticed, which is exactly the
          # critique seed's own threshold comment makes of its previous floor.
          #
          # Ratchet plan (#235): raise as coverage rises. Never lower it to make
          # a red build green -- fix or add the tests instead.
          #   2026-Q3: 62 (current)
          #   2027-Q2: 70
          MIN_COVERAGE=62

          if (( $(echo "$COVERAGE < $MIN_COVERAGE" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below the minimum of ${MIN_COVERAGE}%"
            exit 1
          fi

      - name: Coverage summary
        run: |
          {
            echo "### Go coverage"
            echo
            echo '```'
            go tool cover -func=coverage.out | tail -n 20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage-profile
          path: coverage.out
          retention-days: 14

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          # The repo ships .golangci.yml and `make lint` runs it, but CI never
          # did — the other three products have gated on it for months. Full
          # tree verified clean (0 issues) before this gate was added.
          args: --timeout=5m

      - name: Buf lint
        # Pinned rather than floating: `make lint` runs bare `buf lint` against
        # whatever the developer has installed, so CI is the only place the
        # version is nailed down.
        run: go run github.com/bufbuild/buf/cmd/buf@v1.72.0 lint

  # The ubuntu backend job builds the Linux nl80211 backend but never the
  # Windows one, which reads WLAN_BSS_ENTRY straight out of memory wlanapi
  # allocated. A wrong struct offset there does not fail loudly — every field
  # after it is read from the wrong bytes — so the layout test has to run on a
  # real Windows ABI, not be inferred from a cross-compile.
  backend-windows:
    name: Backend (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The runner has no Wi-Fi adapter, so TestLiveScan skips itself. What
      # runs here is the struct layout against the real ABI and the IE parser.
      #
      # cmd/trellisd is here for the same reason: the port walk decides whether
      # a bind failed on "address already in use", and Winsock reports that as
      # a different errno from the one every other platform uses. Get it wrong
      # and the walk silently never happens on Windows.
      - name: Test
        run: go test -race ./internal/capture/... ./cmd/trellisd/...

  # Every darwin-only file is behind //go:build darwin && cgo, so the ubuntu
  # backend job never compiles the capture backend. It reaches CoreWLAN through
  # cgo and Objective-C, and a break there would leave every other check green —
  # the blind spot that let Seed's macOS Wi-Fi rot into dead code unnoticed.
  #
  # This job is also the only place docs/07-RISKS R5 can be enforced: cgo is
  # part of the build on no other runner.
  backend-darwin:
    name: Backend (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Linking, not merely compiling, is what proves the -framework LDFLAGS
      # resolve: building a library package stops after the Objective-C compile.
      # The capture test binary links the darwin implementation, covering both.
      # These tests are pure mapping logic, so the runner needs no Wi-Fi adapter
      # and no Location Services grant.
      - name: Test
        run: go test -race ./internal/capture/...

      # R5 promises cgo stays out of the Go core and says "enforce via build/CI
      # check". This is that check — and it can only run where cgo is actually
      # in the build, which is here.
      - name: cgo confinement (docs/07-RISKS R5)
        run: python3 scripts/check-cgo-confinement.py

      # The capture backend is behind `darwin && cgo`, so the tree has to
      # compile without cgo too. Getting that constraint wrong fails with
      # "undefined: corewlan.Scan", which reads like a dependency problem
      # rather than a build-tag one.
      - name: Build without cgo
        run: CGO_ENABLED=0 go build ./...

  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enforce customer-facing vocabulary policy
        run: python3 scripts/check-banned-vocabulary.py

      - name: File-size gate (baseline-ratchet)
        run: ./scripts/check-file-size.sh

      # A theme that is defined but not rendered is the failure the design
      # rollout retired grep-based validation over. This checks the direction
      # that can actually fail: every semantic class the markup uses has a
      # definition behind it.
      - name: Theme contract (semantic classes resolve)
        run: python3 scripts/check-theme-contract.py

      # The four products each own their tsconfig, so the strictness flags
      # drift silently — a missing one never announces itself, it just checks
      # less than its sibling does.
      - name: TypeScript strictness contract
        run: python3 scripts/check-tsconfig-flags.py

      - name: Check for sensitive files
        run: |
          SENSITIVE_FILES=$(find . -type f \( \
            -name "*.env" -o \
            -name "*.pem" -o \
            -name "*.key" -o \
            -name "*secret*" -o \
            -name "*credential*" \
          \) ! -path "./.git/*" ! -name "*.example" ! -name "*.sample" 2>/dev/null || true)
          if [ -n "$SENSITIVE_FILES" ]; then
            echo "Sensitive files found:"
            echo "$SENSITIVE_FILES"
            exit 1
          fi
          echo "No sensitive files found"

      - name: Check for unsafe logging patterns
        run: |
          DANGEROUS_PATTERNS=(
            'log\.Print.*password'
            'log\.Print.*token'
            'log\.Print.*Authorization'
            'log\.Print.*apikey'
          )
          found=0
          for pattern in "${DANGEROUS_PATTERNS[@]}"; do
            if grep -rniE "$pattern" --include="*.go" internal/ cmd/ core/ 2>/dev/null; then
              found=1
            fi
          done
          if [ "$found" -eq 1 ]; then
            echo "::error::Potentially unsafe logging of credentials"
            exit 1
          fi
          echo "No unsafe logging patterns found"

  # ===========================================================================
  # Security Scanning
  # ===========================================================================
  # trellis gated govulncheck and Semgrep but had no secret scanning, no
  # dependency audit and no filesystem scan -- thinner than seed, stem and niac,
  # which all run the full set. Same tools, same pins, same fail-closed posture.
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Only for the SARIF upload below.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks scans history, not just the tip.
          fetch-depth: 0

      - uses: ./.github/actions/setup-node

      - name: Run npm audit
        working-directory: ui
        run: |
          npm ci
          npm audit --audit-level=high

      # gitleaks-action needs a paid licence for organisation repos and fails
      # red without ever scanning. The MIT-licensed CLI is the same engine.
      # Verified against trellis history before this was made blocking:
      # 167 commits scanned, no leaks -- so it starts clean rather than
      # arriving with an allowlist written to hide day-one findings.
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: "8.30.0"
          # SHA-256 of gitleaks_8.30.0_linux_x64.tar.gz from the upstream
          # checksums.txt. Rotate with GITLEAKS_VERSION on upgrade.
          GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner --exit-code 1

      - name: Run Trivy vulnerability scanner
        # exit-code 0 so the SARIF is always written; the explicit check below
        # is what fails CI, so a scanner error cannot pass as "no findings".
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      # Not continue-on-error: a silent upload failure leaves the Security tab
      # showing an older scan, so the dashboard reads "clean" because nothing
      # new arrived rather than because nothing was found.
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif

      - name: Fail on CRITICAL/HIGH findings
        run: |
          set -euo pipefail
          if [ ! -f trivy-results.sarif ]; then
            echo "::error::Trivy produced no SARIF -- the scan did not run, which is a failure, not a pass"
            exit 1
          fi
          count=$(python3 -c "import json,sys; d=json.load(open('trivy-results.sarif')); print(sum(len(r.get('results',[])) for r in d.get('runs',[])))")
          echo "Trivy CRITICAL/HIGH findings: ${count}"
          if [ "$count" -gt 0 ]; then
            echo "::error::Trivy reported ${count} CRITICAL/HIGH finding(s)"
            exit 1
          fi

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - name: Run govulncheck
        # Pinned, not @latest. govulncheck is a hard gate per fleet policy, and
        # an unpinned gate can change behaviour with no code change — either a
        # spurious break or a silent loss of coverage. Renovate tracks this pin
        # via the customManager in MustardSeedNetworks/.github.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  # ===========================================================================
  # E2E — the UI as trellisd actually serves it
  # ===========================================================================
  # trellis had no browser coverage at all. The unit suite proves components
  # render; it cannot see the daemon/UI seam, which is where this repo's known
  # heatmap read-path defects lived -- and those passed unit tests that asserted
  # counts rather than values.
  #
  # The daemon embeds the UI from internal/api/ui, so the UI is built first and
  # the suite drives the resulting binary rather than a Vite dev server.
  e2e:
    name: E2E Browser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go

      - uses: ./.github/actions/setup-node

      - name: Install
        working-directory: ui
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ui
        run: npx playwright install --with-deps chromium webkit

      # Into internal/api/ui, which the daemon go:embeds. Without this the
      # binary serves nothing and every test fails on an empty page.
      - name: Build the UI the daemon will serve
        working-directory: ui
        run: npm run build

      # Universal Build Contract. This is the one job with the UI embedded, so
      # it is where a `make build` binary can be proven to carry the hash: the
      # md5 the script computes must appear in the binary, or /__version would
      # report "unknown" in production and deployment validation could not
      # tell a pipeline build from a bare `go build`.
      - name: Verify UIBuildHash embedded (Universal Build Contract)
        run: |
          make build
          EXPECTED=$(./scripts/ui-build-hash.sh)
          if [ "${#EXPECTED}" -ne 32 ]; then
            echo "::error::UI build hash is not 32 hex chars: '$EXPECTED' — is internal/api/ui empty?"
            exit 1
          fi
          if ! grep -a -q "$EXPECTED" bin/trellisd; then
            echo "::error::bin/trellisd does not contain UIBuildHash $EXPECTED"
            exit 1
          fi
          echo "bin/trellisd carries UIBuildHash $EXPECTED"

      - name: Run E2E
        working-directory: ui
        # No --reporter: passing one REPLACES the config's reporter array, and
        # the config writes the JSON the flake budget reads.
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7

      # A test that fails then passes on retry reports `flaky` and the job exits
      # 0, so a retry-pass looks exactly like a pass. Budget 0 from the start --
      # this suite is new, so there is no existing flake debt to grandfather.
      - name: Enforce flake budget
        if: always()
        uses: MustardSeedNetworks/.github/.github/actions/flake-budget@75858ef449c9dd62c96b91429e44a8c4b4161af2 # v1.10.0
        with:
          report: ui/playwright-report/results.json
          budget: "0"

  frontend:
    name: Frontend (React/TS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Install
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      # test:coverage, not test: the thresholds in ui/vitest.config.ts are the
      # gate. Running plain `npm run test` executed every case and asked
      # nothing about what they covered, which is how three survey files
      # reached 0% unnoticed.
      - name: Test (Vitest, coverage-gated)
        run: npm run test:coverage

      - name: Build (tsc strict + vite)
        run: npm run build

  # ============================================================================
  # Internationalization (i18n) Validation
  # ============================================================================
  # Blocking from day one: no --ratchet, no baseline file, no allow-list. The
  # other three products retrofitted i18n and are still paying that down —
  # trellis was localized at 22 files precisely so it never acquires the debt,
  # and a gate that starts permissive is how the debt gets acquired.
  #
  # The checks live once in MustardSeedNetworks/.github; this repo keeps only
  # its glossary, banned vocabulary, glossary exceptions and dynamic-prefix
  # allow-list (which is empty, and meant to stay that way).
  i18n:
    name: i18n Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate i18n (parity, glossary, banned vocab, etc.)
        uses: MustardSeedNetworks/.github/.github/actions/i18n-validate@a146506fd53fe5e01fdc01892dd838c10081d183 # v1.9.0

  # Fleet-shared SAST gate (MustardSeedNetworks/.github, pinned).
  semgrep:
    uses: MustardSeedNetworks/.github/.github/workflows/semgrep.yml@a146506fd53fe5e01fdc01892dd838c10081d183 # v1.9.0
    permissions:
      contents: read
      # v1.8.0 publishes the all-severity SARIF to code scanning. The
      # upload is deliberately not continue-on-error, so this scope is
      # required, not optional.
      security-events: write

  # Asserts this repo's own gates are wired to gate: every job below is either
  # in ci-complete's needs or documented in .github/ci-advisory-jobs.txt, the
  # enabled linters meet the declared tier, and tool installs are pinned. Two
  # such gaps were found by hand on 2026-08-16; both arrived via a merge, which
  # is why this runs per PR rather than on a schedule.
  # Defined once in MustardSeedNetworks/.github (fleet-shared); ci-complete
  # still needs: [ci-conformance].
  ci-conformance:
    uses: MustardSeedNetworks/.github/.github/workflows/ci-conformance.yml@a146506fd53fe5e01fdc01892dd838c10081d183 # v1.9.0
    permissions:
      contents: read

  # ============================================================================
  # CI Complete — the single required status check
  # ============================================================================
  # Matches seed, stem and niac-go. Branch protection requires this one context
  # instead of naming every job, so adding a job does not mean remembering to
  # update protection — the aggregator picks it up via `needs:`.
  #
  # `if: always()` so it still runs when an upstream job fails; the step below
  # decides pass/fail. Skipped counts as success: path-filtered jobs legitimately
  # do not run.
  # Fails the build on any open High/Critical CodeQL alert on the default
  # branch. The CodeQL job itself reports success when the *analysis* succeeds,
  # regardless of what it found, so without this a repository can carry open
  # High alerts with every check green. Scoped to CodeQL rather than "any High
  # alert": the code-scanning tab also carries Scorecard *scores* at High
  # severity, several of which encode deliberate decisions.
  codeql-alert-gate:
    name: CodeQL Alert Gate
    uses: MustardSeedNetworks/.github/.github/workflows/codeql-alert-gate.yml@cd60ad04e0f305b3706481580091dc7f3e1863aa # v1.11.0
    permissions:
      security-events: read

  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - backend
      - backend-darwin
      - backend-windows
      - quality
      - govulncheck
      - security
      - frontend
      - e2e
      - i18n
      - semgrep
      - ci-conformance
      - codeql-alert-gate
    if: always()
    steps:
      - name: Verify upstream results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "Upstream job results:"
          echo "$RESULTS" | jq '.'
          if ! echo "$RESULTS" | jq -e 'to_entries | map(.value.result) | all(. == "success" or . == "skipped")' >/dev/null; then
            echo "::error::One or more required CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All required CI jobs passed (or were intentionally skipped)."
