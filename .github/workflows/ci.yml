name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Required for the merge queue: `CI Complete` is a required status check, so
  # it must report on merge_group events too. Without this the queue accepts a
  # PR and then waits forever for a check that never fires.
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Go-only CI for now. The fleet-shared reusable license-check/semgrep
  # workflows (MustardSeedNetworks/.github) assume a ui/ npm project; wire
  # those in once Trellis grows its UI. govulncheck is a hard gate per fleet
  # policy.
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1
          # The repo ships .golangci.yml and `make lint` runs it, but CI never
          # did — the other three products have gated on it for months. Full
          # tree verified clean (0 issues) before this gate was added.
          args: --timeout=5m

      - name: Buf lint
        # Pinned rather than floating: `make lint` runs bare `buf lint` against
        # whatever the developer has installed, so CI is the only place the
        # version is nailed down.
        run: go run github.com/bufbuild/buf/cmd/buf@v1.72.0 lint

  # Every darwin-only file is behind //go:build darwin && cgo, so the ubuntu
  # backend job never compiles the capture backend. It reaches CoreWLAN through
  # cgo and Objective-C, and a break there would leave every other check green —
  # the blind spot that let Seed's macOS Wi-Fi rot into dead code unnoticed.
  #
  # This job is also the only place docs/07-RISKS R5 can be enforced: cgo is
  # part of the build on no other runner.
  backend-darwin:
    name: Backend (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Linking, not merely compiling, is what proves the -framework LDFLAGS
      # resolve: building a library package stops after the Objective-C compile.
      # The capture test binary links the darwin implementation, covering both.
      # These tests are pure mapping logic, so the runner needs no Wi-Fi adapter
      # and no Location Services grant.
      - name: Test
        run: go test -race ./internal/capture/...

      # R5 promises cgo stays out of the Go core and says "enforce via build/CI
      # check". This is that check — and it can only run where cgo is actually
      # in the build, which is here.
      - name: cgo confinement (docs/07-RISKS R5)
        run: python3 scripts/check-cgo-confinement.py

      # The capture backend is behind `darwin && cgo`, so the tree has to
      # compile without cgo too. Getting that constraint wrong fails with
      # "undefined: corewlan.Scan", which reads like a dependency problem
      # rather than a build-tag one.
      - name: Build without cgo
        run: CGO_ENABLED=0 go build ./...

  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enforce customer-facing vocabulary policy
        run: python3 scripts/check-banned-vocabulary.py

      - name: File-size gate (baseline-ratchet)
        run: ./scripts/check-file-size.sh

      # A theme that is defined but not rendered is the failure the design
      # rollout retired grep-based validation over. This checks the direction
      # that can actually fail: every semantic class the markup uses has a
      # definition behind it.
      - name: Theme contract (semantic classes resolve)
        run: python3 scripts/check-theme-contract.py

      # The four products each own their tsconfig, so the strictness flags
      # drift silently — a missing one never announces itself, it just checks
      # less than its sibling does.
      - name: TypeScript strictness contract
        run: python3 scripts/check-tsconfig-flags.py

      - name: Check for sensitive files
        run: |
          SENSITIVE_FILES=$(find . -type f \( \
            -name "*.env" -o \
            -name "*.pem" -o \
            -name "*.key" -o \
            -name "*secret*" -o \
            -name "*credential*" \
          \) ! -path "./.git/*" ! -name "*.example" ! -name "*.sample" 2>/dev/null || true)
          if [ -n "$SENSITIVE_FILES" ]; then
            echo "Sensitive files found:"
            echo "$SENSITIVE_FILES"
            exit 1
          fi
          echo "No sensitive files found"

      - name: Check for unsafe logging patterns
        run: |
          DANGEROUS_PATTERNS=(
            'log\.Print.*password'
            'log\.Print.*token'
            'log\.Print.*Authorization'
            'log\.Print.*apikey'
          )
          found=0
          for pattern in "${DANGEROUS_PATTERNS[@]}"; do
            if grep -rniE "$pattern" --include="*.go" internal/ cmd/ core/ 2>/dev/null; then
              found=1
            fi
          done
          if [ "$found" -eq 1 ]; then
            echo "::error::Potentially unsafe logging of credentials"
            exit 1
          fi
          echo "No unsafe logging patterns found"

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
      - name: Run govulncheck
        # Pinned, not @latest. govulncheck is a hard gate per fleet policy, and
        # an unpinned gate can change behaviour with no code change — either a
        # spurious break or a silent loss of coverage. Renovate tracks this pin
        # via the customManager in MustardSeedNetworks/.github.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  frontend:
    name: Frontend (React/TS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node

      - name: Install
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Test (Vitest)
        run: npm run test

      - name: Build (tsc strict + vite)
        run: npm run build

  # ============================================================================
  # Internationalization (i18n) Validation
  # ============================================================================
  # Blocking from day one: no --ratchet, no baseline file, no allow-list. The
  # other three products retrofitted i18n and are still paying that down —
  # trellis was localized at 22 files precisely so it never acquires the debt,
  # and a gate that starts permissive is how the debt gets acquired.
  #
  # The checks live once in MustardSeedNetworks/.github; this repo keeps only
  # its glossary, banned vocabulary, glossary exceptions and dynamic-prefix
  # allow-list (which is empty, and meant to stay that way).
  i18n:
    name: i18n Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate i18n (parity, glossary, banned vocab, etc.)
        uses: MustardSeedNetworks/.github/.github/actions/i18n-validate@e6d74ebd42168c9b89f2b93f14841f58b90edece # v1.5.0

  # Fleet-shared SAST gate (MustardSeedNetworks/.github, pinned).
  semgrep:
    uses: MustardSeedNetworks/.github/.github/workflows/semgrep.yml@37513d7fbaacf4a7adaab1ac1514f021115868d1 # v1.4.0
    permissions:
      contents: read

  # Asserts this repo's own gates are wired to gate: every job below is either
  # in ci-complete's needs or documented in .github/ci-advisory-jobs.txt, the
  # enabled linters meet the declared tier, and tool installs are pinned. Two
  # such gaps were found by hand on 2026-08-16; both arrived via a merge, which
  # is why this runs per PR rather than on a schedule.
  # Defined once in MustardSeedNetworks/.github (fleet-shared); ci-complete
  # still needs: [ci-conformance].
  ci-conformance:
    uses: MustardSeedNetworks/.github/.github/workflows/ci-conformance.yml@37513d7fbaacf4a7adaab1ac1514f021115868d1 # v1.4.0
    permissions:
      contents: read

  # ============================================================================
  # CI Complete — the single required status check
  # ============================================================================
  # Matches seed, stem and niac-go. Branch protection requires this one context
  # instead of naming every job, so adding a job does not mean remembering to
  # update protection — the aggregator picks it up via `needs:`.
  #
  # `if: always()` so it still runs when an upstream job fails; the step below
  # decides pass/fail. Skipped counts as success: path-filtered jobs legitimately
  # do not run.
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - backend
      - backend-darwin
      - quality
      - govulncheck
      - frontend
      - i18n
      - semgrep
      - ci-conformance
    if: always()
    steps:
      - name: Verify upstream results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "Upstream job results:"
          echo "$RESULTS" | jq '.'
          if ! echo "$RESULTS" | jq -e 'to_entries | map(.value.result) | all(. == "success" or . == "skipped")' >/dev/null; then
            echo "::error::One or more required CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All required CI jobs passed (or were intentionally skipped)."
