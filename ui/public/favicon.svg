<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Trellis">
  <!-- The sidebar mark at tab size: the same rounded square and TR monogram,
       so the tab and the app read as one thing. Colours are the brand token's
       literal values (ui/src/theme/product-trellis.css) because an SVG loaded
       as a favicon gets no stylesheet, and the media query gives the dark-mode
       step rather than leaving a dark tab strip holding a dark mark. -->
  <style>
    rect { fill: #0f6f68 }
    text { fill: #ffffff }
    @media (prefers-color-scheme: dark) {
      rect { fill: #5ec8c0 }
      text { fill: #08312e }
    }
  </style>
  <rect width="32" height="32" rx="9" />
  <text x="16" y="21.5" text-anchor="middle"
        font-family="Verdana,DejaVu Sans,sans-serif" font-size="13" font-weight="700"
        letter-spacing="-0.5">TR</text>
</svg>
