// Trellis measured-survey API. Exposes the existing survey engine
// (core/survey): AirMapper import, stored surveys, heatmap rendering, and
// dead-zone/coverage analysis derived from real measured samples.
//
// Scope: measured-survey RPCs only. Predictive-planning capabilities (AP
// placement, wall editing, propagation-model heatmaps) are intentionally not
// defined here — that RF engine does not exist yet.
syntax = "proto3";

package trellis.survey.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/MustardSeedNetworks/trellis/gen/trellis/survey/v1;surveyv1";

// SurveyService serves measured Wi-Fi site surveys backed by core/survey.
service SurveyService {
  // ImportAirMapper imports an AirMapper (.amp) archive into a new stored
  // survey.
  rpc ImportAirMapper(ImportAirMapperRequest) returns (ImportAirMapperResponse);

  // ListSurveys returns summaries of every stored survey.
  rpc ListSurveys(ListSurveysRequest) returns (ListSurveysResponse);

  // GetSurvey returns a single stored survey by ID.
  rpc GetSurvey(GetSurveyRequest) returns (GetSurveyResponse);

  // DeleteSurvey removes a stored survey.
  rpc DeleteSurvey(DeleteSurveyRequest) returns (DeleteSurveyResponse);

  // GetHeatmap renders a measured-signal heatmap for a survey's active floor.
  rpc GetHeatmap(GetHeatmapRequest) returns (GetHeatmapResponse);

  // GetCoverage runs dead-zone detection over a survey's measured samples.
  rpc GetCoverage(GetCoverageRequest) returns (GetCoverageResponse);

  // ListFloors returns every floor of a survey, lowest level first.
  rpc ListFloors(ListFloorsRequest) returns (ListFloorsResponse);

  // GetFloor returns one floor of a survey by ID.
  rpc GetFloor(GetFloorRequest) returns (GetFloorResponse);

  // GenerateReport renders a PDF report for a survey.
  rpc GenerateReport(GenerateReportRequest) returns (GenerateReportResponse);

  // CreateSurvey opens a new, empty survey to walk. The measured counterpart
  // of ImportAirMapper: the samples come from this host's radio rather than
  // from a file.
  rpc CreateSurvey(CreateSurveyRequest) returns (CreateSurveyResponse);

  // StartSurvey moves a survey into the state that accepts samples.
  rpc StartSurvey(StartSurveyRequest) returns (StartSurveyResponse);

  // PauseSurvey stops a survey accepting samples without completing it.
  rpc PauseSurvey(PauseSurveyRequest) returns (PauseSurveyResponse);

  // CompleteSurvey closes a survey to further samples.
  rpc CompleteSurvey(CompleteSurveyRequest) returns (CompleteSurveyResponse);

  // CapturePoint scans the airspace and records what it sees at a position on
  // the survey's active floor.
  //
  // Unary rather than streaming: an active scan takes seconds and the radio
  // returns cached values if asked again inside its cache window, so a stream
  // would deliver duplicates at whatever rate the client asked for. The
  // surveyor stands at a point, captures it, and moves — one call per point.
  rpc CapturePoint(CapturePointRequest) returns (CapturePointResponse);

  // ListSamples returns the points stored on a survey's active floor, in
  // capture order. SurveySummary carries only a count; this is what lets a
  // client draw where a walk has already been, across a reload or a restart.
  rpc ListSamples(ListSamplesRequest) returns (ListSamplesResponse);

  // Scan reads the airspace and records nothing. It is what the live analysis
  // view runs on, and it belongs to no survey: a reading taken while someone
  // is looking at a page was taken at no position on any floor.
  //
  // Unary for the same reason CapturePoint is: a scan blocks in the driver for
  // seconds and the radio serves its cache inside that window, so a stream
  // would repeat itself at whatever rate a client asked for. The client polls.
  rpc Scan(ScanRequest) returns (ScanResponse);
}


// SurveySummary is the lightweight survey representation used in list and
// single-survey replies.
message SurveySummary {
  string id = 1;
  string name = 2;
  string status = 3;
  int32 floor_count = 4;
  int32 sample_count = 5;
  bool has_floor_plan = 6;
}

message ImportAirMapperRequest {
  string name = 1;
  bytes amp_data = 2;
}

message ImportAirMapperResponse {
  SurveySummary survey = 1;
}

message ListSurveysRequest {}

message ListSurveysResponse {
  repeated SurveySummary surveys = 1;
}

message GetSurveyRequest {
  string id = 1;
}

message GetSurveyResponse {
  SurveySummary survey = 1;
}

message DeleteSurveyRequest {
  string id = 1;
}

message DeleteSurveyResponse {}

// Floor is one storey of a surveyed building, with the counts a caller needs
// to decide whether it is worth drawing.
message Floor {
  string id = 1;
  // Operator-facing name: "Floor 1", "Basement".
  string name = 2;
  // Storey number, which may be negative. Floors are ordered by it.
  int32 level = 3;
  int32 sample_count = 4;
  bool has_floor_plan = 5;
  // The floor the survey collects onto, and the one the heatmap and coverage
  // RPCs read when a request names no floor.
  bool is_active = 6;
}

message ListFloorsRequest {
  string survey_id = 1;
}

message ListFloorsResponse {
  repeated Floor floors = 1;
}

message GetFloorRequest {
  string survey_id = 1;
  string floor_id = 2;
}

message GetFloorResponse {
  Floor floor = 1;
}

message GetHeatmapRequest {
  string survey_id = 1;
  // Heatmap metric: "rssi" or "snr". Defaults to "rssi".
  string metric = 2;
  // Floor to render. Empty means the survey's active floor.
  //
  // Naming a floor renders that floor's own samples on its own plan. Without
  // it a multi-floor survey interpolates every floor's measurements onto
  // whichever plan happens to be active, which is only right when there is
  // one floor.
  string floor_id = 3;
}

message GetHeatmapResponse {
  bytes png = 1;
  int32 width = 2;
  int32 height = 3;
  double min = 4;
  double max = 5;
  int32 sample_count = 6;
  // The metric actually rendered. An unrecognised request metric falls back
  // to rssi, so a caller that labels its legend from what it asked for can
  // label the wrong scale; this is what was drawn.
  string metric = 7;
  // The colour scale the image was painted with, sent so a legend describes
  // the gradient on screen rather than a second copy of it.
  repeated LegendStop legend = 8;

  // The interpolated field the image was painted from, row-major:
  // grid[row * grid_cols + col], in the heatmap metric's own unit.
  //
  // Sent so a caller can report the measured value under a cursor. The
  // alternative — reading it back from a pixel — cannot work: heat is
  // composited at partial alpha over the floor plan, so the colour on screen
  // is not the colour the scale chose. One value per cell rather than per
  // pixel keeps this the same size as the PNG beside it.
  repeated float grid = 9;
  int32 grid_cols = 10;
  int32 grid_rows = 11;
  // Cell edge in image pixels. A position (x, y) on the image is the cell at
  // (y / cell_size) * grid_cols + (x / cell_size).
  int32 cell_size = 12;
}

// LegendStop is one stop of a heatmap's colour scale: the metric value and
// the colour the renderer uses at that value, interpolating between stops.
message LegendStop {
  // Metric value at this stop, in the heatmap metric's own unit (dBm for
  // rssi, dB for snr).
  double value = 1;
  // Hex sRGB, "#rrggbb".
  string color = 2;
}

message GetCoverageRequest {
  string survey_id = 1;
  // Dead-zone threshold in dBm. Defaults to -75.
  int32 threshold_dbm = 2;
  // Floor to analyse. Empty means every floor's samples together, which is
  // the whole-survey verdict; naming a floor scores that floor alone.
  string floor_id = 3;
}

message GetCoverageResponse {
  double coverage_score = 1;
  int32 dead_zone_count = 2;
  repeated string recommendations = 3;
}

message GenerateReportRequest {
  string survey_id = 1;
  // What the report should contain. Absent means the engine's defaults:
  // executive summary, recommendations and heatmaps, no raw-data appendix.
  ReportOptions options = 2;
}

// ReportOptions selects the report's sections and its cover-page branding.
//
// core/survey has supported these since the generator was written; the API
// hardcoded the defaults, so an operator always got the same document. Every
// field here is one the generator actually reads.
message ReportOptions {
  // Per-floor heatmap images. Omitting them makes a much smaller PDF.
  bool include_heatmaps = 1;
  // The sample-by-sample appendix. Off by default: it is long.
  bool include_raw_data = 2;
  bool include_recommendations = 3;
  bool include_executive_summary = 4;
  // Printed on the cover page. This is what makes the PDF a deliverable
  // rather than a printout.
  string company_name = 5;
}

message GenerateReportResponse {
  bytes pdf = 1;
}

message CreateSurveyRequest {
  string name = 1;
  string description = 2;
  // Wi-Fi interface to survey with, as the host names it ("en0", "wlan0").
  string interface = 3;
  // No survey-type field: passive scanning is the only kind this service can
  // gather. core/survey has other types, but nothing implements them, so
  // offering the choice would only let a caller ask for a survey that silently
  // came back passive. Add the field when there is a second real value.
}

message CreateSurveyResponse {
  SurveySummary survey = 1;
}

message StartSurveyRequest {
  string id = 1;
}

message StartSurveyResponse {
  SurveySummary survey = 1;
}

message PauseSurveyRequest {
  string id = 1;
}

message PauseSurveyResponse {
  SurveySummary survey = 1;
}

message CompleteSurveyRequest {
  string id = 1;
}

message CompleteSurveyResponse {
  SurveySummary survey = 1;
}

message CapturePointRequest {
  string survey_id = 1;
  // Position on the active floor plan, in floor-plan pixel coordinates — the
  // same space imported samples use.
  int32 x = 2;
  int32 y = 3;
}

message CapturePointResponse {
  // Every BSS observed at this point, strongest signal first.
  repeated ScannedNetwork networks = 1;

  // Aggregations the heatmap and coverage analysis read, computed over the
  // networks above so a client does not recompute them.
  int32 unique_ssids = 2;
  int32 unique_bssids = 3;
  int32 ap_count_2_4ghz = 4;
  int32 ap_count_5ghz = 5;
  int32 ap_count_6ghz = 6;
  int32 co_channel_aps = 7;
  int32 adj_channel_aps = 8;
}

// ScannedNetwork is one observed BSS at one moment, mirroring
// core/wifi.ScannedNetwork.
message ScannedNetwork {
  string ssid = 1;
  string bssid = 2;
  int32 signal_dbm = 3;
  int32 channel = 4;
  int32 frequency_mhz = 5;
  string security = 6;
  int32 channel_width_mhz = 7;
  int32 noise_floor_dbm = 8;
  int32 snr_db = 9;
  // Widest PHY carrying this channel width: "HT20", "VHT80", "EHT320", ...
  string ht_mode = 10;
  // Channel requires radar detection (DFS).
  bool is_dfs = 11;

  // BSS this host is currently joined to. True for at most one network in a
  // response, and for none on an unassociated host. Never set on Windows,
  // whose current connection is not reported on the BSS list.
  bool associated = 12;

  // Percentage of airtime the AP advertised its own channel busy, from its
  // BSS Load element. Optional because not every AP sends that element and
  // macOS exposes no raw elements at all: 0 is a real reading for an idle
  // channel, so absent has to be distinguishable from it.
  optional int32 channel_utilization_percent = 13;
}

message ScanRequest {}

message ScanResponse {
  // Every BSS observed, strongest signal first.
  repeated ScannedNetwork networks = 1;

  // When the sweep was taken, so a client can show the age of what it is
  // displaying rather than implying the values are live to the second.
  google.protobuf.Timestamp scanned_at = 2;
}

message ListSamplesRequest {
  string survey_id = 1;
}

message ListSamplesResponse {
  repeated SurveySample samples = 1;
}

// SurveySample is one stored measurement point, reduced to what a client
// needs to draw it. The full scan behind a point stays server-side; the
// heatmap and the report read it there.
message SurveySample {
  // Position on the active floor plan, in floor-plan pixel coordinates.
  int32 x = 1;
  int32 y = 2;
  google.protobuf.Timestamp captured_at = 3;
  // BSSs observed at this point. Zero for a point whose sample is not a
  // passive scan.
  int32 network_count = 4;
  // Signal of the strongest BSS observed, in dBm. Absent when nothing was
  // observed, since 0 dBm would read as a very strong signal.
  optional int32 strongest_dbm = 5;
}
