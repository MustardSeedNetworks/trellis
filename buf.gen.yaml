# Plugins are local commands with the version in the argv, not BSR `remote:`
# plugins. A remote plugin is a BSR RPC. Unpinned, it serves whatever was
# released last; pinned, anonymous callers are still rate-limited
# (`resource_exhausted`), and a GitHub-hosted runner shares that egress, so a
# drift gate built on it is flaky-red. `go run <module>@<version>` is the pin:
# buf executes that exact module, so a binary on PATH cannot change a byte of
# gen/.
#
# Each version equals the runtime it generates against — go.mod's
# google.golang.org/protobuf and connectrpc.com/connect/v2. renovate.json tracks
# the `<module>@<version>` literal and regenerates on the bump. On 2026-10-15
# the merge queue failed `make check-generated` whenever a generator moved and
# the committed tree still carried the previous stamp (survey_pb.ts).
version: v2
inputs:
  - directory: proto
plugins:
  - local:
      - go
      - run
      - google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
    out: gen
    opt: paths=source_relative
  - local:
      - go
      - run
      - connectrpc.com/connect/v2/cmd/protoc-gen-connect-go@v2.0.2
    out: gen
    opt: paths=source_relative
